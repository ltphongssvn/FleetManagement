# FleetManagement/.github/workflows/railway-deploy.yml
# Production deploy to Railway via GitHub Actions -- the explicit, controllable,
# auditable CI deploy path. Replaces ad-hoc 'railway up' from a developer
# laptop with a versioned, gated workflow.
#
# Pattern (2026 industry standard, per Railway blog 2025-12 'CI/CD for Modern
# Deployment' + dorny/paths-filter monorepo guidance):
# - Trigger: workflow_run on CI success on main (chained CI/CD), OR manual
#   workflow_dispatch with a service selector for surgical deploys.
# - Gate: HAS_RAILWAY_TOKEN fork-safety guard mirrors the railway-guard.yml
#   pattern already in this repo. Skip cleanly when the token is absent.
# - Base-SHA resolution: extracted into scripts/ci/resolve-ci-sha.ts (schema-
#   first Zod + pure functions + vitest contract) so the resolution rules can
#   be unit-tested. Replaces the inline 'base: HEAD~1' which failed under
#   workflow_run context with 'git failed exit 128' (paths-filter tried to
#   merge-base HEAD~1 against a non-existent local ref).
# - Deploy: official ghcr.io/railwayapp/cli:latest container. railway up
#   --service <name> --ci is Railway canonical CI flag -- streams build
#   logs and exits with the build exit code (better than --detach for CI).
# - Change detection: dorny/paths-filter@v4 maps changed paths to services.
#   In auto mode we deploy ONLY services whose tracked paths changed.
#   all / api / ops-web / worker inputs override for surgical deploys.
# - Ordering: api -> ops-web -> worker. result == skipped is tolerated so a
#   skipped upstream does not block downstream.
# - Per-service health gate: api /health/ready -> 200, ops-web /login -> 200,
#   worker via boot logs.
# - Concurrency: cancel-in-progress: false -- never cancel an in-flight
#   deploy (production safety).
#
# Railway dashboard prerequisite (one-time): all three services must be in
# CLI-only mode -- Settings -> Source shows Connect Repo / Connect Image
# with nothing linked. This prevents double-deploys.

name: Deploy to Railway

on:
  workflow_run:
    # Gate on E2E (Playwright), not CI: the merge-to-main E2E run is the
    # production quality gate (2026 CD practice -- nothing ships to prod until
    # the critical user journeys pass against the merged main state). E2E only
    # runs after the build/CI succeeds, so an E2E success implies CI success;
    # keying the deploy on E2E means a broken critical flow BLOCKS the deploy
    # instead of shipping and merely turning a status badge red afterward.
    # (Previously keyed on CI, which finished before E2E, so the deploy raced
    # ahead and the E2E-on-main run gated nothing.)
    workflows: ['E2E (Playwright)']
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      services:
        description: 'Services to deploy (auto=detect, all=all 3, or one)'
        type: choice
        default: auto
        options:
          - auto
          - all
          - api
          - ops-web
          - worker

permissions:
  contents: read

concurrency:
  group: deploy-railway-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Gate (CI green + change detection)
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    outputs:
      has_token: ${{ steps.token.outputs.has_token }}
      deploy_api: ${{ steps.detect.outputs.api }}
      deploy_ops_web: ${{ steps.detect.outputs.ops_web }}
      deploy_worker: ${{ steps.detect.outputs.worker }}
      head_sha: ${{ steps.resolve.outputs.head_sha }}
    env:
      HAS_RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN != '' }}
    steps:
      - name: Token presence gate
        id: token
        run: |
          if [ "$HAS_RAILWAY_TOKEN" = 'true' ]; then
            echo 'has_token=true' >> "$GITHUB_OUTPUT"
            echo 'RAILWAY_TOKEN present, deploy will proceed'
          else
            echo 'has_token=false' >> "$GITHUB_OUTPUT"
            echo '::warning::RAILWAY_TOKEN not set, deploy will skip'
          fi
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Resolve base SHA (pure TS, unit-tested)
        id: resolve
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_SHA: ${{ github.sha }}
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          BASE_SHA=$(pnpm run --silent ci:resolve-sha)
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = 'workflow_run' ]; then
            echo "head_sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "head_sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi
          echo "resolved base_sha=$BASE_SHA"
      - name: Detect changed services
        id: detect
        uses: dorny/paths-filter@v4
        with:
          base: ${{ steps.resolve.outputs.base_sha }}
          filters: |
            api:
              - 'apps/api/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
            ops_web:
              - 'apps/ops-web/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
            worker:
              - 'workers/main-worker/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - 'package.json'

  deploy-api:
    name: Deploy api
    needs: gate
    if: >
      needs.gate.outputs.has_token == 'true' && (
        github.event.inputs.services == 'all' ||
        github.event.inputs.services == 'api' ||
        (github.event_name == 'workflow_run' && needs.gate.outputs.deploy_api == 'true') ||
        (github.event.inputs.services == 'auto' && needs.gate.outputs.deploy_api == 'true')
      )
    runs-on: ubuntu-latest
    container: ghcr.io/railwayapp/cli:latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.gate.outputs.head_sha }}
      - name: Deploy api (CI mode)
        run: railway up --service api --ci
      - name: Wait for /health/ready (5min budget)
        # ghcr.io/railwayapp/cli is a minimal Alpine image; curl is not
        # installed by default. apk-install it for the HTTP probe.
        run: |
          apk add --no-cache curl >/dev/null
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://api-production-fd42.up.railway.app/health/ready || echo 000)
            if [ "$code" = '200' ]; then echo 'api ready'; exit 0; fi
            echo "attempt $i: HTTP $code"; sleep 10
          done
          echo '::error::api /health/ready not 200 after 5min'; exit 1

  deploy-ops-web:
    name: Deploy ops-web
    needs: [gate, deploy-api]
    if: >
      always() &&
      needs.gate.outputs.has_token == 'true' &&
      (needs.deploy-api.result == 'success' || needs.deploy-api.result == 'skipped') &&
      (
        github.event.inputs.services == 'all' ||
        github.event.inputs.services == 'ops-web' ||
        (github.event_name == 'workflow_run' && needs.gate.outputs.deploy_ops_web == 'true') ||
        (github.event.inputs.services == 'auto' && needs.gate.outputs.deploy_ops_web == 'true')
      )
    runs-on: ubuntu-latest
    container: ghcr.io/railwayapp/cli:latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.gate.outputs.head_sha }}
      - name: Deploy ops-web (CI mode)
        run: railway up --service ops-web --ci
      - name: Wait for /login (5min budget)
        # ghcr.io/railwayapp/cli is a minimal Alpine image; curl is not
        # installed by default. apk-install it for the HTTP probe.
        run: |
          apk add --no-cache curl >/dev/null
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://xe.vominhchau.com/login || echo 000)
            if [ "$code" = '200' ]; then echo 'ops-web ready'; exit 0; fi
            echo "attempt $i: HTTP $code"; sleep 10
          done
          echo '::error::ops-web /login not 200 after 5min'; exit 1

  deploy-worker:
    name: Deploy worker
    needs: [gate, deploy-ops-web]
    if: >
      always() &&
      needs.gate.outputs.has_token == 'true' &&
      (needs.deploy-ops-web.result == 'success' || needs.deploy-ops-web.result == 'skipped') &&
      (
        github.event.inputs.services == 'all' ||
        github.event.inputs.services == 'worker' ||
        (github.event_name == 'workflow_run' && needs.gate.outputs.deploy_worker == 'true') ||
        (github.event.inputs.services == 'auto' && needs.gate.outputs.deploy_worker == 'true')
      )
    runs-on: ubuntu-latest
    container: ghcr.io/railwayapp/cli:latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.gate.outputs.head_sha }}
      - name: Deploy worker (CI mode)
        run: railway up --service worker --ci
      - name: Confirm worker booted
        run: |
          sleep 30
          railway logs --service worker --build 2>&1 | tail -50 || true
          echo 'worker deploy submitted; verify logs above show Started N workers'

  post-deploy-smoke:
    # Post-deploy smoke gate (2026 CD best practice: a fast critical-path check
    # AFTER deploy, distinct from the per-service liveness probes above which
    # only confirm the server answers). The review-view Cancel crash shipped
    # precisely because /login returned 200 the whole time while the Server
    # Action POST path was throwing -- liveness was green, the journey was
    # broken. This job exercises the critical path itself and fails the run
    # loudly on regression. Tolerant chaining mirrors the deploy jobs: it runs
    # whenever the upstream deploys succeeded or were skipped (so a no-op
    # change set still smoke-checks the already-live site).
    name: Post-deploy smoke (critical paths)
    needs: [gate, deploy-api, deploy-ops-web, deploy-worker]
    if: >
      always() &&
      needs.gate.outputs.has_token == 'true' &&
      (needs.deploy-api.result == 'success' || needs.deploy-api.result == 'skipped') &&
      (needs.deploy-ops-web.result == 'success' || needs.deploy-ops-web.result == 'skipped') &&
      (needs.deploy-worker.result == 'success' || needs.deploy-worker.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: API health is ready
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' https://api-production-fd42.up.railway.app/health/ready || echo 000)
          echo "api /health/ready -> $code"
          [ "$code" = '200' ] || { echo '::error::api /health/ready not 200'; exit 1; }
      - name: ops-web login renders
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' https://xe.vominhchau.com/login || echo 000)
          echo "ops-web /login -> $code"
          [ "$code" = '200' ] || { echo '::error::ops-web /login not 200'; exit 1; }
      - name: Cancel Server Action regression tripwire
        # The review-view Cancel crash was caused by the proxy DIVERTING the
        # Server Action POST to /login: Next.js cannot forward a rewrite for a
        # Server Action, so the action client received the /login payload and
        # threw. The unique on-the-wire signature of that bug is the response
        # header x-middleware-rewrite: /login on a Server Action POST (proven
        # live in the original incident). The fix makes the proxy pass Server
        # Actions through, so that header MUST be absent.
        #
        # NOTE: we deliberately do NOT assert on x-nextjs-action-not-found.
        # That header is Next's normal response to any unknown/ malformed action
        # id -- including the synthetic all-zero id this probe must use (a real,
        # valid action id cannot be forged from CI). A healthy, fixed app still
        # returns x-nextjs-action-not-found for a bogus id, and bots routinely
        # trip it, so it cannot distinguish fixed from broken. The full valid-
        # action + expired-session flow is covered by the e2e spec
        # dispatch-order-cancel-expired-session.spec.ts, which is the correct
        # place for end-to-end Server Action verification.
        run: |
          tmp=$(mktemp)
          code=$(curl -s -o /dev/null -D "$tmp" -w '%{http_code}' \
            -X POST 'https://xe.vominhchau.com/dispatch/orders/XTT.05-002' \
            -H 'Next-Action: 00000000000000000000000000000000000000000' \
            -H 'Accept: text/x-component' \
            -H 'Content-Type: text/plain;charset=UTF-8' \
            --data '[]' || echo 000)
          echo "cancel Server Action POST -> HTTP $code"
          echo '--- response headers ---'; cat "$tmp"
          if grep -qi 'x-middleware-rewrite:[[:space:]]*/login' "$tmp"; then
            echo '::error::REGRESSION: Server Action POST carries x-middleware-rewrite: /login -- the proxy is diverting Server Actions to /login again. The cancel crash has returned.'
            rm -f "$tmp"; exit 1
          fi
          rm -f "$tmp"
          echo 'Server Action path healthy (proxy is NOT diverting actions to /login).'

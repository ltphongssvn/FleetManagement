# .github/workflows/promote.yml
# Auto-promote develop -> main on green CI + E2E, then back-merge main -> develop.
#
# Why this exists (release cadence as a forcing function):
#   In GitFlow, develop is an integration branch and nothing automatically
#   promotes to main, so unreleased commits silently accumulate into large,
#   risky batches (the "develop holding tank" anti-pattern). This workflow
#   removes the manual promote step: every time develop is fully green it
#   opens/merges a develop -> main PR, so releases stay small and frequent and
#   the production Dockerfiles (exercised only on the release path) get tested
#   per-change instead of per-batch.
#
# Gating (atomic two-workflow check):
#   develop runs CI and E2E (Playwright) in parallel on every push. Each, on
#   success, dispatches THIS workflow. Because either may dispatch first, the
#   gate job re-derives develop's head SHA and explicitly confirms BOTH the
#   latest CI AND the latest E2E run for that exact SHA concluded success before
#   promoting. If only one is green yet, it exits cleanly; the second dispatch
#   re-runs the gate and proceeds.
#
# Auth (GitHub App, not GITHUB_TOKEN):
#   GITHUB_TOKEN cannot push to a branch protected by a ruleset, and merges it
#   makes do not emit push events (so release.yml / railway-deploy.yml would be
#   suppressed). We mint a GitHub App installation token (fleetmgmt-promote-bot,
#   on the ruleset bypass list for develop + main). The App can: merge the
#   promotion PR, push the back-merge directly to develop, and -- because App
#   tokens DO trigger downstream workflows -- fire release + deploy via push.
#
# Back-merge + loop prevention:
#   Promoting creates a merge commit on main that develop lacks; without
#   reconciling, develop drifts one commit behind every release. After merging,
#   we back-merge main -> develop and push with [skip ci] in the message so the
#   back-merge does NOT re-trigger CI/E2E (which would re-fire this workflow on
#   a content-free commit -> empty release -> more drift -> loop). Because the
#   back-merge runs no CI/E2E, neither dispatches this workflow, so promotion
#   cannot re-fire on the bot's own commit -- no loop, and no skipped runs.
name: Promote develop to main

on:
  # Dispatched explicitly by CI and E2E (their final develop-only job) when they
  # succeed. Using workflow_dispatch instead of workflow_run means this workflow
  # NEVER launches just to skip: it only runs when a green CI/E2E on develop
  # asks it to. (workflow_run has no conclusion/actor filter at the trigger
  # level, so it would fire-then-skip on unrelated completions and on the bot's
  # own [skip ci] back-merge chain.)
  workflow_dispatch:

concurrency:
  group: promote-develop-to-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  promote:
    name: Promote develop -> main
    runs-on: ubuntu-latest
    steps:
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.PROMOTE_APP_CLIENT_ID }}
          private-key: ${{ secrets.PROMOTE_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - name: Verify both CI and E2E are green for develop head SHA
        id: gate
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          # Dispatched on develop success; gate on develop's CURRENT head SHA.
          SHA=$(git rev-parse origin/develop)
          echo "Gating on develop SHA: $SHA"
          ci_concl=$(gh run list --workflow=ci.yml --branch=develop --commit="$SHA" --limit=1 --json conclusion --jq '.[0].conclusion // ""')
          e2e_concl=$(gh run list --workflow=e2e.yml --branch=develop --commit="$SHA" --limit=1 --json conclusion --jq '.[0].conclusion // ""')
          echo "CI conclusion:  $ci_concl"
          echo "E2E conclusion: $e2e_concl"
          if [ "$ci_concl" = "success" ] && [ "$e2e_concl" = "success" ]; then
            echo "Both CI and E2E green for $SHA -> promoting."
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not both green yet (CI=$ci_concl E2E=$e2e_concl). The sibling workflow completion will re-run this gate."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open develop -> main PR
        if: steps.gate.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          ahead=$(git rev-list --count origin/main..origin/develop)
          echo "develop is $ahead commit(s) ahead of main"
          if [ "$ahead" = "0" ]; then
            echo "Nothing to promote (develop == main)."
            exit 0
          fi
          existing=$(gh pr list --base main --head develop --state open --json number --jq '.[0].number // ""')
          if [ -n "$existing" ]; then
            echo "Reusing open promotion PR #$existing"
            exit 0
          fi
          gh pr create --base main --head develop --title "release: promote develop to main" --body "Automated promotion: develop is green on both CI and E2E. Merging triggers semantic-release and the Railway deploy."

      - name: Merge promotion PR (triggers release + deploy via App push)
        if: steps.gate.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          num=$(gh pr list --base main --head develop --state open --json number --jq '.[0].number // ""')
          if [ -z "$num" ]; then
            echo "No open promotion PR (develop already == main). Nothing to do."
            exit 0
          fi
          gh pr merge "$num" --merge
          echo "Merged PR #$num into main. App-authored merge push will trigger release.yml and railway-deploy.yml."

      - name: Back-merge main into develop (skip ci, prevents drift + loop)
        if: steps.gate.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          git config user.name 'fleetmgmt-promote-bot[bot]'
          git config user.email '297748693+fleetmgmt-promote-bot[bot]@users.noreply.github.com'
          git fetch origin main develop
          git checkout develop
          git reset --hard origin/develop
          if git merge-base --is-ancestor origin/main HEAD; then
            echo 'develop already contains main; no back-merge needed.'
            exit 0
          fi
          git merge --no-ff origin/main -m 'chore: back-merge main into develop [skip ci]'
          git push origin develop
          echo 'Back-merged main into develop with [skip ci]; develop is back in sync with main.'

# ============================================================================
# File:     FleetManagement/.github/workflows/ci.yml
# Purpose:  GitHub Actions CI workflow that runs the Turborepo quality gates
#           (lint, typecheck, test, build) on every push and on PRs targeting
#           the long-lived GitFlow branches (main, develop).
#
# Why it exists:
#   The Frozen Stack (Fleet-Management-Stack.pdf) mandates "TDD +
#   Testcontainers + CI ephemeral schemas per parallel runner" and GitFlow.
#   This workflow is the remote enforcement point that makes branch
#   protection rules meaningful.
#
# Job topology:
#   setup             -> install + build + lint + typecheck once.
#   api-tests         -> 4-way matrix; each shard runs ~1/4 of apps/api's test
#                        files and uploads its partial v8 coverage JSON.
#   coverage-gate     -> merges the 4 partial coverage reports and enforces the
#                        90/90/90/90 per-file threshold on the COMPLETE picture.
#   other-tests       -> the fast non-api workspace packages, unsharded.
#   security-guards   -> secret/topology guard + root-script tests and lint.
#   all-checks-passed -> THE SINGLE REQUIRED CHECK; every gate feeds it.
#
# THE REQUIRED-CHECK CONTRACT (read this before adding a job):
#   Exactly ONE check name belongs in the branch rulesets: "All checks passed".
#   Every gate job must appear in that job's needs: list. Adding a job without
#   adding it there means the job runs and blocks nothing.
#
#   Root cause this eliminates: required checks live in GITHUB SETTINGS while
#   jobs live in THIS FILE -- two sources of truth that drift by construction.
#   security-guards is the receipt. It was built as its own named check
#   precisely "so the branch ruleset can require it", it runs the secret guard,
#   test:scripts and lint:scripts, and it was NEVER ADDED to develop-protection
#   or main-protection. For its entire life a PR could merge with the secret
#   guard, the destructive-operation guard and every root-script test red or
#   never started. Adding that one name by hand would have fixed one job and
#   guaranteed the same bug for the next. 2026 guidance names the failure
#   directly: a renamed or forgotten job makes the rule "silently stop
#   enforcing anything", and the answer is one aggregate check everything else
#   feeds, so membership becomes a reviewable diff instead of a settings click.
#
#   scripts/ci-aggregate-gate.guard.test.ts asserts the membership, and it runs
#   under test:scripts inside security-guards -- which the aggregate requires.
#   A forgotten job therefore fails the required check that enforces it.
#
# Why sharded:
#   apps/api has 152 test files, most real-Postgres testcontainers
#   integration tests that must run serially (fileParallelism:false avoids
#   40P01 truncate deadlocks). As one job it took >30m on a 2-core runner
#   and was cancelled at the timeout. Splitting the file list across 4
#   matrix jobs runs them in parallel (~4x throughput) so each shard
#   finishes well inside its timeout.
#
# Why coverage is gated in a separate job:
#   Each shard executes only a SUBSET of test files, so the per-file 90%
#   threshold cannot be enforced per shard. Shards run threshold-free
#   (vitest.coverage.config.ts applies thresholds only when
#   VITEST_ENFORCE_THRESHOLDS is set); the coverage-gate job merges all
#   four partial coverage-final.json files via scripts/merge-coverage.mjs
#   and enforces 90/90/90/90 once on the merged report.
#
# Local/CI lint parity (type-aware ESLint):
#   The @typescript-eslint/no-unsafe-* rules are type-aware and need a real TS
#   program for every linted file. Two requirements keep CI in parity with
#   local:
#     1. Each app/package tsconfig MUST declare every ambient @types it relies
#        on in compilerOptions.types. An explicit types array EXCLUDES all
#        other @types packages, so omitting "node" makes process.env / URL
#        resolve to any and trips no-unsafe-* in a clean CI program (passes
#        locally only because a warm program retains the globals).
#     2. Build all workspace packages BEFORE lint/typecheck (the single "Build"
#        step below does a full turbo run build, compiling every package's
#        declarations) so cross-package @fleet/* import types resolve. turbo's
#        build task also caches **/*.tsbuildinfo atomically with dist/, and
#        each library build clears dist + tsbuildinfo before tsc so .d.ts are
#        always re-emitted (elevenlabs/packages#595). Do NOT delete
#        *.tsbuildinfo between build and lint.
#
# CI environment notes:
#   - setup-node@v5 auto-enables package-manager caching when package.json
#     has a packageManager field; this fails when pnpm is not yet on PATH.
#     Every setup-node step sets package-manager-cache: false and the pnpm
#     store is cached explicitly via actions/cache.
#   - pnpm/action-setup@v5 uses NO explicit version: the root package.json
#     packageManager field is the single source of truth.
#   - Checkouts are SHALLOW (fetch-depth: 1, fetch-tags: false). This note
#     previously claimed fetch-depth: 0 was required for Turborepo --affected
#     filtering and tagging. Both halves were false, and the claim is what kept
#     six jobs per run cloning full history plus every branch and tag:
#       * --affected is invoked NOWHERE in this repo. resolve-ci-sha.ts:17-18
#         records that it was deliberately rejected in favour of API base-SHA
#         resolution, specifically so clones could stay shallow.
#       * Nothing in this workflow reads a tag or any history. version.ts:5
#         reads NEXT_PUBLIC_APP_VERSION, injected from package.json via
#         next.config.ts; version-drift.test.ts pins package.json as the source
#         of truth. Every rev-list / git-tag caller is local dev tooling under
#         scripts/, or lives in release.yml / promote.yml, which keep their own
#         checkout config and are unaffected by this file.
#     If a future job here needs history (e.g. a diff-based path filter), give
#     THAT job the depth it needs rather than restoring depth 0 for all of them.
#
# Related files:
#   - turbo.jsonc                        — task definitions
#   - package.json                       — packageManager field
#   - scripts/merge-coverage.mjs          — partial-coverage merge + gate
#   - apps/api/vitest.coverage.config.ts  — VITEST_ENFORCE_THRESHOLDS gate
#   - .pre-commit-config.yaml             — local mirror of these gates
#   - scripts/ci-aggregate-gate.guard.test.ts — asserts the aggregate membership
# ============================================================================
name: CI
on:
  # Scope: run CI ONCE per change. On a PR branch, push+pull_request would BOTH
  # fire, doubling the concurrent Postgres-testcontainer / PGlite-WASM load the
  # apps/api suite is tuned for (vitest.coverage.config.ts maxWorkers:1) and
  # intermittently melting a shard under runner CPU/Docker contention. So:
  #   * pull_request on ANY base branch -> the single run that validates a PR
  #     (its checks satisfy the ruleset, which matches by check NAME regardless
  #     of triggering event), and it tests the merge result.
  #   * push ONLY on the long-lived branches main + develop -> where there is no
  #     PR, so push is the sole trigger; this is also what fires the
  #     dispatch-promote job on a green develop push.
  # Feature-branch pushes no longer self-run CI; the PR's pull_request run does.
  push:
    branches: [main, develop]
  pull_request:
    branches: ["**"]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  # Opt JavaScript actions (actions/cache, download-artifact, etc.) onto
  # Node 24 ahead of the 2026-06-02 forced cutover, clearing the Node 20
  # deprecation warnings.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # turbo.jsonc sets remoteCache.signature:true, so turbo HMAC-SHA256-signs
  # artifacts on upload and VERIFIES them on download; any artifact that fails
  # verification is SILENTLY treated as a cache miss. The key must therefore be
  # in the environment of the step that runs TURBO -- signing is turbo's job,
  # not the cache server's (rharkor/caching-for-turbo only supplies TURBO_API /
  # TURBO_TOKEN / TURBO_TEAM and proxies to the Actions cache).
  #
  # Declared at WORKFLOW level deliberately. It was first attached as step-level
  # env on the caching action itself, which GitHub scopes to that step alone --
  # so the later Build step ran turbo with signature:true and NO key. Run
  # 29582220071 is the receipt: setup executed hashes 9d45559821005cb9 /
  # 6980c5deee87153b / cd839492c612b82e / 8587f5af9e2e56d2 / 8a50541737bbf8b2,
  # then api-tests recomputed the SAME five hashes four minutes later and logged
  # 'Remote caching enabled' followed by 'cache miss, executing' on every one.
  # Identical keys missing means the artifacts were unreadable, not unfound.
  # Workflow level is one declaration that reaches every step of every job, so
  # no future turbo job can be added without it.
  TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
jobs:
  setup:
    name: Install / Build / Lint / Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Shallow. fetch-depth: 0 was here for --affected filtering and
          # tagging; BOTH claims are false in this workflow. --affected is
          # invoked nowhere in the repo -- resolve-ci-sha.ts:17-18 records that
          # this repo DELIBERATELY rejected it in favour of API base-SHA
          # resolution precisely to keep clones shallow. And nothing here reads
          # git history or tags: version.ts:5 reads NEXT_PUBLIC_APP_VERSION,
          # injected from package.json via next.config.ts (version-drift.test.ts
          # guards that package.json stays the source of truth), and every
          # rev-list / git-tag caller is either local dev tooling in scripts/ or
          # lives in release.yml / promote.yml, which keep their own checkout.
          #
          # So six jobs per run were cloning full history plus every branch and
          # tag to satisfy a requirement that does not exist.
          fetch-depth: 1
          # Tags are pure overhead here for the same reason: this workflow never
          # reads one. Skipping them avoids transferring every tag in the repo
          # on all six jobs.
          fetch-tags: false
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Get pnpm store path
        id: pnpm-store
        if: hashFiles('pnpm-lock.yaml') != ''
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache pnpm store
        if: hashFiles('pnpm-lock.yaml') != ''
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-
      - name: Verify repo layout
        run: |
          test -f .gitignore
          echo "Repo layout OK (scaffold pending)"
      - name: Install dependencies
        if: hashFiles('pnpm-lock.yaml') != ''
        run: pnpm install --frozen-lockfile
      # Turborepo remote cache, backed by GitHub Actions own cache -- no Vercel
      # account and no external service; any HTTP server implementing the Turbo
      # Remote Cache API would do. Stands up that server on localhost and
      # exports TURBO_API / TURBO_TOKEN / TURBO_TEAM to every later step in THIS
      # job. Runners are ephemeral and jobs share nothing, so each turbo-running
      # job needs its own copy of this step (setup, api-tests x4, other-tests --
      # six jobs per run rebuilding the same five packages today).
      #
      # Without this step, remoteCache.enabled:true in turbo.jsonc is INERT:
      # turbo logs 'Remote caching disabled' and falls back to a local cache the
      # ephemeral runner throws away. Verified locally via turbo --dry.
      #
      # TURBO_REMOTE_CACHE_SIGNATURE_KEY is REQUIRED, not optional hardening:
      # turbo.jsonc sets signature:true, so artifacts are HMAC-SHA256 signed and
      # any artifact failing verification is SILENTLY TREATED AS A CACHE MISS.
      # Omit the key and the hit rate is 0% while every log still looks healthy.
      - name: Turborepo remote cache (GitHub Actions cache backend)
        uses: rharkor/caching-for-turbo@v2.5.0
        with:
          # REQUIRED for cross-job hits, and the reason the first two attempts
          # missed 100% while logging 'Remote caching enabled'. GitHub's cache
          # service versions an entry by the PATH of the saved blob as well as
          # its key. The blob lives in RUNNER_TEMP, and every job gets a fresh
          # runner with a different RUNNER_TEMP, so setup saved under one
          # path-derived version and api-tests looked up another: key matched,
          # version did not, miss. Upstream documents this exactly -- set it
          # 'when jobs may save and restore the same cache from runners with
          # different temporary directories'. Relative path => versions match
          # across runners.
          use-relative-cache-path: true
      # TWO-TIER AUDIT, and the tiers were the wrong way round until 2026-08-18.
      #
      # THE BLOCKING TIER NOW GATES ON WHAT SHIPS. It previously ran
      #   pnpm audit --audit-level=high --prod
      # over the WORKSPACE graph, which is not the tree that runs. pnpm
      # materialises optional peers regardless (pnpm#11155), so apps/api pulls
      # drizzle-orm -> expo-sqlite -> expo -> metro -> image-size even though
      # apps/api declares no Expo dependency and never imports expo-sqlite --
      # while Dockerfile.api prunes exactly that subtree with --no-optional.
      #
      # So advisories against packages that CANNOT REACH PRODUCTION blocked
      # every branch in the repo. pnpm-workspace.yaml records the cost in its
      # own comments: seven of the last ten commits to that file are floor
      # raises for advisories that never ship, each an override or an
      # ignoreGhsas entry written, reviewed and merged for a package absent
      # from every image -- crowding the allowlist a little more, which is how
      # a real finding eventually slips past unread.
      #
      # //#audit:artifact builds the deploy tree each Dockerfile builds and
      # audits THAT. Verified on first run: @fleet/api 548 packages clean,
      # @fleet/main-worker 123 packages clean, with every currently-ignored
      # advisory absent from both. It FAILS CLOSED -- an artifact that could
      # not be built, or an implausibly small tree, exits 3 UNVERIFIABLE rather
      # than clean, because an audit of an empty directory reports no
      # vulnerabilities and that reads exactly like success.
      #
      # NO BUILD DEPENDENCY: pnpm deploy resolves a dependency tree and does
      # not need dist/, so this runs before Build exactly where the old step
      # did. That is why the job needed no reorder.
      - name: Security audit (deploy ARTIFACT, blocking)
        if: hashFiles('pnpm-lock.yaml') != ''
        run: pnpm run audit:artifact
      # THE ADVISORY TIER, unchanged in intent and now correctly non-blocking
      # for the whole graph. A dev-tooling advisory is real and gets fixed on
      # its own cadence; it must not hold every branch hostage. The finding
      # stays visible in the run log without failing the check -- which is what
      # this step's own comment already said, while the step above it enforced
      # the opposite.
      - name: Security audit (workspace graph, advisory only)
        if: hashFiles('pnpm-lock.yaml') != ''
        continue-on-error: true
        run: pnpm audit --audit-level=high
      - name: Build
        # Full workspace build. Emits every package's dist/ + .d.ts +
        # tsbuildinfo, which the type-aware lint/typecheck steps below depend
        # on to resolve cross-package types. --concurrency=1 keeps peak memory
        # bounded on the 2-core runner; turbo's ^build ordering still applies.
        #
        # --force was REMOVED here. It means 'ignore the cache and execute
        # anyway', so with it this step would reach the remote cache wired up
        # above and then decline to use it -- the cache would be populated but
        # never read, and the whole change would show as a no-op. Cache
        # correctness is not --force's job: turbo hashes task inputs, and the
        # build task already declares its inputs and outputs precisely
        # (turbo.jsonc), so a hit means the inputs are byte-identical. If a hit
        # were ever wrong, the fix is the input declaration, not blanket
        # re-execution. Restoring dist/ + .d.ts + tsbuildinfo from cache is
        # exactly what the lint/typecheck steps below need, and turbo's build
        # task owns tsbuildinfo atomically with dist/ (see the header note).
        if: hashFiles('pnpm-lock.yaml') != ''
        run: pnpm exec turbo run build --concurrency=1
      - name: Lint + Typecheck (cached)
        # Routed through turbo, NOT pnpm -r, so both tasks read and write the
        # remote cache. Measured cost of the old pnpm -r path on a warm run:
        # Lint 95s + Typecheck 51s = 146s that never cached, dwarfing the 4s
        # cached Build. turbo.jsonc defines lint and typecheck as cacheable
        # tasks (outputs:[] but input-keyed), so an unchanged tree replays them
        # in milliseconds instead of re-running eslint and tsc across 11
        # packages every run. Both declare dependsOn ^build for type-aware
        # @fleet/* .d.ts resolution; Build already ran above, so ^build is a
        # warm cache hit here, not a rebuild. One turbo invocation lets turbo
        # parallelise the two task graphs and short-circuit on cache hits.
        if: hashFiles('pnpm-lock.yaml') != ''
        run: pnpm exec turbo run lint typecheck
      - name: E2E Typecheck
        # The Playwright e2e specs live at the repo root (e2e/), outside any
        # workspace package, so `pnpm -r typecheck` never reaches them. They are
        # transpiled by Playwright's esbuild at runtime, which strips types
        # without checking them, so type errors there go unnoticed unless tsc is
        # run explicitly against e2e/tsconfig.json. Gate them here.
        if: hashFiles('pnpm-lock.yaml') != ''
        run: pnpm exec tsc --noEmit -p e2e/tsconfig.json
      - name: E2E Lint
        # The SAME gap this file already documents for typecheck, for lint.
        # @fleet/e2e is a workspace member but declares only a typecheck script,
        # so `turbo run lint` visited its DEPENDENCY and reported success
        # without linting a single spec -- e2e/ went unlinted for the life of
        # the repo while eslint.config.mjs carefully bound e2e/**/*.ts to
        # e2e/tsconfig.json for type-aware rules that never executed. The first
        # run reported 35 violations, all since fixed to zero.
        #
        # A CI STEP, not only the __ci_fast__ wiring: this workflow never
        # invokes that turbo node, which is exactly why the security-guards job
        # below exists. Wiring alone would have left the check real locally and
        # absent remotely -- the third instance of that hole in this repo, after
        # //#lint:scripts and //#typecheck:scripts.
        if: hashFiles('pnpm-lock.yaml') != ''
        run: pnpm run lint:e2e

  api-tests:
    name: API tests (shard ${{ matrix.shard }}/4)
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Shallow. fetch-depth: 0 was here for --affected filtering and
          # tagging; BOTH claims are false in this workflow. --affected is
          # invoked nowhere in the repo -- resolve-ci-sha.ts:17-18 records that
          # this repo DELIBERATELY rejected it in favour of API base-SHA
          # resolution precisely to keep clones shallow. And nothing here reads
          # git history or tags: version.ts:5 reads NEXT_PUBLIC_APP_VERSION,
          # injected from package.json via next.config.ts (version-drift.test.ts
          # guards that package.json stays the source of truth), and every
          # rev-list / git-tag caller is either local dev tooling in scripts/ or
          # lives in release.yml / promote.yml, which keep their own checkout.
          #
          # So six jobs per run were cloning full history plus every branch and
          # tag to satisfy a requirement that does not exist.
          fetch-depth: 1
          # Tags are pure overhead here for the same reason: this workflow never
          # reads one. Skipping them avoids transferring every tag in the repo
          # on all six jobs.
          fetch-tags: false
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # See the setup job for why this step exists and why the signature key is
      # mandatory. Repeated per job because runners share nothing. This job is
      # the clearest case for it: the five packages rebuilt below were ALREADY
      # built by setup, and this matrix rebuilds them four more times.
      - name: Turborepo remote cache (GitHub Actions cache backend)
        uses: rharkor/caching-for-turbo@v2.5.0
        with:
          # REQUIRED for cross-job hits, and the reason the first two attempts
          # missed 100% while logging 'Remote caching enabled'. GitHub's cache
          # service versions an entry by the PATH of the saved blob as well as
          # its key. The blob lives in RUNNER_TEMP, and every job gets a fresh
          # runner with a different RUNNER_TEMP, so setup saved under one
          # path-derived version and api-tests looked up another: key matched,
          # version did not, miss. Upstream documents this exactly -- set it
          # 'when jobs may save and restore the same cache from runners with
          # different temporary directories'. Relative path => versions match
          # across runners.
          use-relative-cache-path: true
      - name: Build workspace package deps
        run: pnpm exec turbo run build --filter=@fleet/observability --filter=@fleet/sync-protocol --filter=@fleet/domain --filter=@fleet/test-fixtures --filter=@fleet/main-worker
      - name: Pre-pull Postgres image (testcontainers warm cache)
        # Pull through Google's mirror.gcr.io pull-through cache to avoid
        # flaky/rate-limited Docker Hub pulls on the shared GitHub Actions
        # egress IP (observed: connection timeout on registry-1.docker.io).
        # Re-tag to the canonical Docker Hub name so testcontainers
        # (POSTGRES_IMAGE in pg-global-setup.ts) resolves from the warm local
        # cache. Falls back to a direct Docker Hub pull if the mirror misses.
        run: |
          docker pull mirror.gcr.io/library/postgres:16.4-alpine3.20 \
            && docker tag mirror.gcr.io/library/postgres:16.4-alpine3.20 postgres:16.4-alpine3.20 \
            || docker pull postgres:16.4-alpine3.20
      - name: Test shard (coverage, threshold-free)
        working-directory: apps/api
        # No VITEST_ENFORCE_THRESHOLDS: this shard runs only 1/4 of the test
        # files, so the per-file gate would fail on every file it did not
        # execute. The coverage-gate job enforces the threshold on the merge.
        run: |
          rm -rf coverage
          pnpm exec vitest run --config vitest.coverage.config.ts --coverage --shard=${{ matrix.shard }}/4
      - name: Upload partial coverage
        uses: actions/upload-artifact@v6
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: apps/api/coverage/merged/coverage-final.json
          if-no-files-found: error

  coverage-gate:
    name: Coverage gate (merge + 90/90/90/90)
    needs: api-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Download all coverage shards
        uses: actions/download-artifact@v7
        with:
          pattern: coverage-shard-*
          path: coverage-shards
      - name: Merge coverage and enforce 90/90/90/90 gate
        working-directory: apps/api
        # merge-coverage.mjs sums the 4 partial v8 coverage-final.json files
        # and exits non-zero if any non-excluded file is below 90% on
        # statements, branches, functions, or lines.
        run: |
          node ../../scripts/merge-coverage.mjs ../../coverage-shards/coverage-shard-1 ../../coverage-shards/coverage-shard-2 ../../coverage-shards/coverage-shard-3 ../../coverage-shards/coverage-shard-4
      - name: Upload merged coverage
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-merged
          path: apps/api/coverage/merged/coverage-final.json
          if-no-files-found: ignore

  other-tests:
    name: Workspace package tests (non-api)
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Shallow. fetch-depth: 0 was here for --affected filtering and
          # tagging; BOTH claims are false in this workflow. --affected is
          # invoked nowhere in the repo -- resolve-ci-sha.ts:17-18 records that
          # this repo DELIBERATELY rejected it in favour of API base-SHA
          # resolution precisely to keep clones shallow. And nothing here reads
          # git history or tags: version.ts:5 reads NEXT_PUBLIC_APP_VERSION,
          # injected from package.json via next.config.ts (version-drift.test.ts
          # guards that package.json stays the source of truth), and every
          # rev-list / git-tag caller is either local dev tooling in scripts/ or
          # lives in release.yml / promote.yml, which keep their own checkout.
          #
          # So six jobs per run were cloning full history plus every branch and
          # tag to satisfy a requirement that does not exist.
          fetch-depth: 1
          # Tags are pure overhead here for the same reason: this workflow never
          # reads one. Skipping them avoids transferring every tag in the repo
          # on all six jobs.
          fetch-tags: false
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # See the setup job for why this step exists and why the signature key is
      # mandatory. Sixth and last turbo-running job in this workflow; the five
      # packages rebuilt below were already built by setup and by all four
      # api-tests shards.
      - name: Turborepo remote cache (GitHub Actions cache backend)
        uses: rharkor/caching-for-turbo@v2.5.0
        with:
          # REQUIRED for cross-job hits, and the reason the first two attempts
          # missed 100% while logging 'Remote caching enabled'. GitHub's cache
          # service versions an entry by the PATH of the saved blob as well as
          # its key. The blob lives in RUNNER_TEMP, and every job gets a fresh
          # runner with a different RUNNER_TEMP, so setup saved under one
          # path-derived version and api-tests looked up another: key matched,
          # version did not, miss. Upstream documents this exactly -- set it
          # 'when jobs may save and restore the same cache from runners with
          # different temporary directories'. Relative path => versions match
          # across runners.
          use-relative-cache-path: true
      - name: Build workspace package deps
        run: pnpm exec turbo run build --filter=@fleet/observability --filter=@fleet/sync-protocol --filter=@fleet/domain --filter=@fleet/test-fixtures --filter=@fleet/main-worker
      - name: Test non-api packages (with coverage)
        # apps/api is covered by the sharded api-tests + coverage-gate jobs;
        # exclude it here so its slow suite does not run twice.
        run: pnpm -r --if-present --filter='!@fleet/api' test:coverage

  # ---------------------------------------------------------------------------
  # Repository-level SECURITY CONTROL, enforced as a boundary rather than a
  # report. It runs BEFORE a change can merge, and a violation FAILS THE BUILD --
  # it does not merely describe a problem after the fact.
  #
  # Why it is a separate job and not a step inside setup: it must surface as its
  # own named check so the branch ruleset can require it, and so a security
  # rejection is never buried in build output.
  #
  # Why it exists at all: the guards were previously wired only into the
  # __ci_fast__ turbo node, which THIS WORKFLOW NEVER INVOKES. The root scripts/
  # tree belongs to no workspace package, so other-tests (pnpm -r ... test:coverage)
  # never reaches it either. The protection was therefore real locally and absent
  # remotely -- a human expectation, not an enforceable rule. This job closes that
  # gap: a pull request carrying a production credential or production topology
  # cannot pass CI.
  #
  # What it blocks:
  #   * production credential literals in local env files (untracked by design, so
  #     pre-commit check-env-files and detect-secrets never inspect them);
  #   * production hostnames / infrastructure topology anywhere in TRACKED source,
  #     matched by SHA-256 hash so the guard config never stores the forbidden
  #     host in plaintext;
  #   * regressions in the guards themselves (test:scripts covers both guards plus
  #     every other root script).
  security-guards:
    name: Security guards (secrets + prod topology)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          fetch-tags: false
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # The guard is the BOUNDARY: non-zero exit fails this job, which fails the
      # PR. Runs before any deployment job could ever be reached.
      - name: Secret + production-topology guard
        run: pnpm run guard:local-secrets
      # The guards are only trustworthy if their own logic is verified. This also
      # covers destructive-operation and authorization guard tests that live in
      # root scripts/, which no other job in this workflow executes.
      - name: Guard unit tests (root scripts)
        run: pnpm run test:scripts
      # Root scripts/ belongs to no workspace package, so the package-scoped lint
      # task never reached it and this tooling went unlinted for the life of the
      # repo. It is now bound to scripts/tsconfig.json and type-aware linted like
      # any package (--max-warnings=0), which is what the security guards
      # themselves are written in.
      - name: Lint root scripts
        run: pnpm run lint:scripts

  # ---------------------------------------------------------------------------
  # THE SINGLE REQUIRED CHECK. Every gate job feeds this one, and ONLY this name
  # belongs in the branch rulesets.
  #
  # WHY if: always() IS LOAD-BEARING, NOT COSMETIC. A job with needs: is SKIPPED
  # when any dependency fails, and GitHub reports a skipped required check as
  # NEUTRAL -- which SATISFIES the ruleset. Without always() this aggregator
  # would go green by being skipped at exactly the moment a gate failed, which
  # is the decorative-control failure it exists to end. always() forces it to
  # run, and the step below then FAILS CLOSED.
  #
  # WHY IT SELECTS NON-SUCCESS RATHER THAN LISTING BAD VALUES. Demanding the
  # literal string success from every dependency catches skipped, cancelled AND
  # any future result string GitHub may add. Whitelisting failure/cancelled
  # would let an unknown one through -- the same fail-closed rule estate:verify
  # applies to an unreadable estate.
  all-checks-passed:
    name: All checks passed
    if: always()
    needs: [setup, api-tests, coverage-gate, other-tests, security-guards]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - name: Verify every gate succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$RESULTS"
          failed=$(echo "$RESULTS" | jq -r 'to_entries | map(select(.value.result != "success")) | map(.key) | join(",")')
          if [ -n "$failed" ]; then
            echo "BLOCKED: these jobs did not succeed: $failed"
            exit 1
          fi
          echo "All gates succeeded."

  # ---------------------------------------------------------------------------
  # On a green CI run for a develop push, explicitly dispatch the promote
  # workflow. This replaces promote.yml's old workflow_run trigger (which would
  # launch-then-skip on every unrelated completion). A workflow_dispatch fired
  # with GITHUB_TOKEN is the documented exception that DOES start a new run, and
  # it only happens here on real success -> no skipped promote runs. promote.yml
  # re-verifies that BOTH CI and E2E are green for develop's head before acting,
  # so dispatching from each independently is safe.
  dispatch-promote:
    name: Dispatch promote (develop, on success)
    # DEPENDS ON THE AGGREGATE, not on a second copy of the gate list. It used
    # to repeat [setup, api-tests, coverage-gate, other-tests, security-guards]
    # verbatim, which is the same two-sources-of-truth drift the aggregate
    # exists to remove: a job added to one list and forgotten in the other
    # would let a develop push promote to PRODUCTION past an ungated check.
    # One list now, in one place, asserted by one guard test.
    needs: [all-checks-passed]
    if: >-
      success() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch promote.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh workflow run promote.yml --repo "$GITHUB_REPOSITORY" --ref develop
          echo 'Dispatched promote.yml (CI green on develop).'

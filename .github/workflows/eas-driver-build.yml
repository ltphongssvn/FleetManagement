# ============================================================================
# File:     FleetManagement/.github/workflows/eas-driver-build.yml
# Purpose:  Autonomous EAS build of the driver app (Android APK + iOS IPA) when
#           a DRIVER-RELEVANT change lands on main -- dispatch-only on the
#           runner, completion-gated OFF the runner via the EAS BUILD webhook.
#
# Why native top-level paths: filtering (2026 monorepo best practice):
#   GitHub decides from the push diff whether to start this workflow. An
#   ops-web-only or api-only release produces NO mobile build and burns NO
#   metered EAS build (30/mo, 15 iOS). api/ops-web are deliberately absent.
#
# Why --no-wait (root cause fixed 2026-07-06, replaces the old --wait gate):
#   v2.16.0 evidence: iOS finished in 5 min but Android took 43 min elapsed
#   (EAS queue + build) while the runner idled inside --wait; the job's
#   40-minute window expired -> GH reported a FALSE RED on a build that
#   FINISHED server-side, and every release burned ~2x40 runner-minutes doing
#   nothing. Expo docs: with --no-wait you are not billed for CI execution
#   time while EAS performs the build. The old header feared the inverse
#   failure (dispatch-green hiding a later ERROR); that gate now lives OFF
#   the runner: an EAS BUILD webhook posts the terminal status to the api
#   (/integrations/eas/build-status), which HMAC-verifies and raises a
#   Sentry fatal on any errored build -- same alerting pattern as the
#   break-glass login monitor. Runner cost: ~2 min dispatch per platform.
#
# iOS device inclusion (NO --refresh-ad-hoc-provisioning-profile):
#   Ad Hoc installs are UDID-allowlisted at build time. That flag was tried
#   and REVERTED: in --non-interactive CI it requires an App Store Connect
#   API Key ("No App Store Connect API Key found for ad-hoc provisioning
#   profile refresh"), which this cert-only remote-credentials setup does
#   not have. New driver iPhones are instead added via the interactive
#   eas device:create QR flow (context/ios-driver-iphone-onboarding-
#   playbook.md): register the device, then trigger a rebuild -- the profile
#   already includes it server-side, no ASC API Key needed.
#
# Credentials:
#   - EXPO_TOKEN (repo secret) authenticates the EAS CLI in CI. REQUIRED.
#   - Android keystore + iOS distribution cert/provisioning profile live on
#     the EAS server (remote credentials, valid to 2027-03), so
#     --non-interactive builds BOTH platforms with no Apple/Google prompts.
#     app.json sets ios.infoPlist.ITSAppUsesNonExemptEncryption=false.
#
# Notes:
#   - packager: npm -- the action installs eas-cli GLOBALLY in its own
#     isolated dir; pnpm aborts there (ERR_PNPM_IGNORED_BUILDS on eas-cli's
#     transitive dtrace-provider build script). eas-cli is a standalone tool,
#     not a repo dependency, so npm installs it cleanly.
#   - EAS CLI pinned to the eas.json cli.version range (>=20 <21); Node 22.
#   - preview profile: internal distribution, Android APK (sideload), prod
#     API URL baked via eas.json env.
#   - timeout-minutes: 10 covers checkout + install + dispatch with margin;
#     the build itself no longer runs inside this job.
#
# Related files:
#   - apps/driver-app/eas.json       -- build profiles (preview used here)
#   - apps/driver-app/app.json       -- identifiers, projectId, encryption
#   - apps/api/src/integrations/eas-build-status.controller.ts -- webhook gate
#   - context/ios-driver-iphone-onboarding-playbook.md -- device registration
# ============================================================================
name: EAS Driver Build
on:
  push:
    branches: [main]
    paths:
      - 'apps/driver-app/**'
      - 'packages/sync-protocol/**'
      - 'packages/domain/**'
      - 'packages/observability/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/eas-driver-build.yml'
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        required: false
        default: all
        type: choice
        options:
          - all
          - android
          - ios
concurrency:
  group: eas-driver-build-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
# Make the Node 24 runtime explicit. GitHub forces JavaScript actions onto
# Node 24; expo/expo-github-action@v8 still declares Node 20 in metadata, so
# the runner prints a residual warning until Expo ships a Node-24 action.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
jobs:
  build:
    name: EAS dispatch (driver app, ${{ matrix.platform }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        platform: [android, ios]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Resolve whether this platform should build
        id: gate
        run: |
          CHOICE="${{ github.event.inputs.platform }}"
          CHOICE="${CHOICE:-all}"
          if [ "$CHOICE" = "all" ] || [ "$CHOICE" = "${{ matrix.platform }}" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "Building ${{ matrix.platform }} (choice: $CHOICE)."
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Skipping ${{ matrix.platform }} (choice: $CHOICE)."
          fi
      - name: Setup pnpm
        if: steps.gate.outputs.build == 'true'
        uses: pnpm/action-setup@v5
      - name: Setup Node
        if: steps.gate.outputs.build == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 22.20.0
          package-manager-cache: false
      - name: Setup Expo and EAS
        if: steps.gate.outputs.build == 'true'
        uses: expo/expo-github-action@v8
        with:
          eas-version: '>=20.0.0 <21.0.0'
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm
          expo-cache: false
          eas-cache: false
      - name: Install dependencies
        if: steps.gate.outputs.build == 'true'
        run: pnpm install --frozen-lockfile
      - name: Dispatch build (${{ matrix.platform }}, preview profile, no-wait)
        if: steps.gate.outputs.build == 'true'
        working-directory: apps/driver-app
        run: |
          echo "Dispatching ${{ matrix.platform }} build (completion gated by the EAS BUILD webhook -> api -> Sentry)..."
          eas build \
            --platform "${{ matrix.platform }}" \
            --profile preview \
            --non-interactive \
            --no-wait

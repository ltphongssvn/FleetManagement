# ============================================================================
# File:     FleetManagement/.github/workflows/eas-driver-build.yml
# Purpose:  Autonomous EAS build of the driver app (Android APK + iOS IPA) when a
#           DRIVER-RELEVANT change lands on main, with END-TO-END verification
#           that both builds actually FINISH (not merely dispatch).
#
# Why native top-level paths: filtering (2026 monorepo best practice):
#   GitHub itself decides whether to start this workflow based on the push diff.
#   An ops-web-only or api-only release produces NO mobile build and burns NO
#   metered EAS build (30/mo, 15 iOS). Canonical per-app-workflow + paths filter.
#   api/ops-web are deliberately absent from the paths list below.
#
# Why a per-platform matrix with --wait (2026 completion-gate best practice):
#   The Expo docs are explicit that with --no-wait, "your CI will report that the
#   build job is passing only if triggering EAS Build is successful" -- i.e. a
#   dispatch-only job goes green even if the build later ERRORS. To actually gate
#   on build success, eas build must run with --wait, which blocks until the
#   build finishes and exits NON-ZERO if it errors (failing this job). Running
#   the two platforms as a matrix waits Android and iOS in PARALLEL (one ~10-20
#   min window, not two back-to-back) and yields independent per-platform
#   pass/fail. This replaces any manual eas build:list status check -- the
#   pipeline itself is now the completion gate.
#
# Credentials:
#   - EXPO_TOKEN (repo secret) authenticates the EAS CLI in CI. REQUIRED.
#   - Android keystore + iOS distribution cert/provisioning profile already live
#     on the EAS server (remote credentials, valid to 2027-03), so
#     --non-interactive builds BOTH platforms with no Apple/Google prompts.
#     app.json sets ios.infoPlist.ITSAppUsesNonExemptEncryption=false.
#
# Notes:
#   - packager: npm -- the action installs eas-cli GLOBALLY in its own isolated
#     dir; pnpm v10 aborts there with ERR_PNPM_IGNORED_BUILDS on eas-cli's
#     transitive dtrace-provider build script. eas-cli is a standalone CLI tool,
#     not a repo dependency, so npm installs it cleanly.
#   - EAS CLI pinned to the eas.json cli.version range (>=20 <21); Node 22.20.0.
#   - preview profile: internal distribution, Android APK (sideload), prod API.
#   - timeout-minutes: 40 comfortably covers a --wait build window.
#
# Related files:
#   - apps/driver-app/eas.json       -- build profiles (preview used here)
#   - apps/driver-app/app.json       -- identifiers, projectId, encryption flag
#   - .github/workflows/release.yml  -- semantic-release on the same push to main
# ============================================================================
name: EAS Driver Build
on:
  push:
    branches: [main]
    paths:
      - 'apps/driver-app/**'
      - 'packages/sync-protocol/**'
      - 'packages/domain/**'
      - 'packages/observability/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/eas-driver-build.yml'
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        required: false
        default: all
        type: choice
        options:
          - all
          - android
          - ios
concurrency:
  group: eas-driver-build-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  build:
    name: EAS build (driver app, ${{ matrix.platform }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        platform: [android, ios]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Resolve whether this platform should build
        id: gate
        run: |
          CHOICE="${{ github.event.inputs.platform }}"
          CHOICE="${CHOICE:-all}"
          if [ "$CHOICE" = "all" ] || [ "$CHOICE" = "${{ matrix.platform }}" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "Building ${{ matrix.platform }} (choice: $CHOICE)."
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Skipping ${{ matrix.platform }} (choice: $CHOICE)."
          fi

      - name: Setup pnpm
        if: steps.gate.outputs.build == 'true'
        uses: pnpm/action-setup@v5

      - name: Setup Node
        if: steps.gate.outputs.build == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 22.20.0
          package-manager-cache: false

      - name: Setup Expo and EAS
        if: steps.gate.outputs.build == 'true'
        uses: expo/expo-github-action@v8
        with:
          eas-version: '>=20.0.0 <21.0.0'
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - name: Install dependencies
        if: steps.gate.outputs.build == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build and wait (${{ matrix.platform }}, preview profile)
        if: steps.gate.outputs.build == 'true'
        working-directory: apps/driver-app
        run: |
          echo "Building ${{ matrix.platform }} and waiting for completion..."
          eas build \
            --platform "${{ matrix.platform }}" \
            --profile preview \
            --non-interactive \
            --wait

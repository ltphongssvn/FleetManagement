# ============================================================================
# File:     FleetManagement/.github/workflows/eas-driver-build.yml
# Purpose:  Autonomous EAS build of the driver app (Android APK + iOS IPA) when a
#           DRIVER-RELEVANT change lands on main. Mirrors the release-centric
#           pipeline: release.yml cuts the semver tag and Railway deploys the
#           API/web on push to main; this workflow produces fresh installable
#           mobile binaries for the same push -- but ONLY when the driver app (or
#           a shared package it bundles) actually changed.
#
# Why native top-level paths: filtering (2026 monorepo best practice):
#   GitHub itself decides whether to start this workflow based on the push diff.
#   An ops-web-only or api-only release produces NO mobile build and burns NO
#   metered EAS build (30/mo, 15 iOS). This is the canonical monorepo pattern
#   (per-app workflow + paths filter) and directly enforces "driver features
#   only, never ops-web".
#
# The paths list = the driver app + every workspace package it BUNDLES into the
# native binary. sync-protocol/domain/observability ship inside the app, so a
# change to them warrants a rebuild. api/ops-web are deliberately absent.
#
# One-time gotcha (by design): the very first push that ADDS this workflow file
# runs regardless of paths; every subsequent push filters correctly.
#
# Credentials:
#   - EXPO_TOKEN (repo secret) authenticates the EAS CLI in CI. REQUIRED.
#     Create at expo.dev -> Account Settings -> Access Tokens, then add under
#     GitHub repo Settings -> Secrets and variables -> Actions.
#   - Android keystore + iOS distribution cert/provisioning profile already live
#     on the EAS server (remote credentials, valid to 2027-03), so
#     --non-interactive builds BOTH platforms with no Apple/Google prompts.
#     app.json sets ios.infoPlist.ITSAppUsesNonExemptEncryption=false so there is
#     no App Store Connect encryption prompt.
#
# Notes:
#   - EAS CLI pinned to the eas.json cli.version range (>=20 <21); NOT 'latest'.
#   - Node 22.20.0 matches the eas.json build profile node field.
#   - --no-wait: triggers the build and exits; CI is not billed for EAS build
#     time. Progress + artifact URLs live in the Expo dashboard.
#   - 'preview' profile: internal distribution, Android APK (sideload), pointed
#     at the production Railway API.
#
# Related files:
#   - apps/driver-app/eas.json       -- build profiles (preview used here)
#   - apps/driver-app/app.json       -- identifiers, projectId, encryption flag
#   - .github/workflows/release.yml  -- semantic-release on the same push to main
# ============================================================================
name: EAS Driver Build
on:
  push:
    branches: [main]
    paths:
      - 'apps/driver-app/**'
      - 'packages/sync-protocol/**'
      - 'packages/domain/**'
      - 'packages/observability/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/eas-driver-build.yml'
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        required: false
        default: all
        type: choice
        options:
          - all
          - android
          - ios
concurrency:
  group: eas-driver-build-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  build:
    name: EAS build (driver app)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22.20.0
          package-manager-cache: false

        # packager: npm -- the action installs eas-cli GLOBALLY in its own
        # isolated dir (its own PNPM_HOME, not this repo). Installing via pnpm
        # v10 fails with ERR_PNPM_IGNORED_BUILDS on eas-cli transitive
        # dtrace-provider build script (pnpm v10 blocks unapproved build
        # scripts and exits nonzero in CI; the isolated dir has no
        # pnpm-workspace.yaml to allow it). eas-cli is a standalone CLI tool,
        # not a project dependency, so the installer package manager is
        # irrelevant to this pnpm project -- npm installs it cleanly.
      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: '>=20.0.0 <21.0.0'
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Trigger EAS build (Android + iOS, preview profile)
        working-directory: apps/driver-app
        run: |
          PLATFORM="${{ github.event.inputs.platform }}"
          PLATFORM="${PLATFORM:-all}"
          echo "Triggering EAS build for platform: $PLATFORM"
          eas build \
            --platform "$PLATFORM" \
            --profile preview \
            --non-interactive \
            --no-wait

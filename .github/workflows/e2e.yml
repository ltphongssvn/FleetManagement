# .github/workflows/e2e.yml
# Playwright browser e2e tests against the FULL Docker Compose stack.
#
# WHY push-only (no pull_request): running this on every PR fired a SECOND CI
# run per push alongside ci.yml. That run timed out at 20min because the job
# never started the Compose stack (postgres/api/mock-oauth2) the specs require
# via docker exec, so every token-mint/psql call retried until the wall clock.
# Restored to the pre-2655625 single-fast-gate-per-PR behavior: PRs get one
# ci.yml run; this E2E gate runs post-merge on main/develop and on demand.
#
# WHY ephemeral keys: the api needs ES256 JWT PEMs (env_file: .env). Instead of
# storing production-style secrets, CI generates a throwaway ES256 keypair at
# runtime and writes a disposable .env. No secret is committed or stored.
#
# SHELL-PARSE INVARIANT (real incident: E2E run 26721934438): the run: blocks
# below are YAML literal block scalars (run: |). YAML does NOT process backslash
# escapes inside them, so a backslash before dollar/quote would reach POSIX sh
# verbatim and break parsing (an escaped dollar-paren becomes a bare open-paren
# -> exit 2 before any step runs). Therefore every run: block here MUST use RAW
# dollar-paren command substitution, RAW double quotes and RAW && continuations — never
# backslash-escaped. apps/api/test/ci-workflow-shell-parse.test.ts enforces this.
#
# FAILURE DIAGNOSTICS ARE CAPTURED BY THE STEP THAT FAILS (2026-08-11 incident).
# docker compose up ABORTS ITS OWN STEP the moment a dependency container exits,
# so a log dump placed in the NEXT step never runs, and the trailing
# if: failure() dump fires several steps too late to matter. BOTH existed here,
# and when the API exited 1 inside maybeMigrate the job printed exactly one line
# -- dependency failed to start: container fleet-pilot-api-1 exited (1) -- and
# nothing else. Diagnosing that crash required linking the Railway CLI and
# reading production deploy logs, for a failure CI had reproduced perfectly and
# then discarded. Evidence must be captured by the step that fails; a follow-up
# step is a supplement, never a capture strategy.
# Guarded by apps/api/test/ci-workflow-failure-diagnostics.test.ts.
#
# NO apt-get IN THIS WORKFLOW (2026-08-19). The browser install ran
#   pnpm exec playwright install chromium --with-deps
# and --with-deps shells out to apt-get. Twice in one day -- PR #612 and
# PR #622 -- the job hung there and was killed at the 30-minute ceiling, with
# the log showing apt retrying azure.archive.ubuntu.com:
#   Ign:2 http://azure.archive.ubuntu.com/ubuntu noble InRelease   (x4)
# Nothing else in either run was near that path; both were post-merge E2E runs
# that blocked promote while develop sat green everywhere else.
#
# THIS IS A KNOWN, UNFIXABLE-UPSTREAM DEFECT. Playwright's own issue #23388
# records it: "Sometimes azure.archive.ubuntu.com is unstable. In most Node.js
# applications we never have a need to run apt-get install except when
# installing Playwright browsers. This has been one of the most common cause of
# our build failures" -- and the maintainer response to making the pipeline not
# rely on apt is "It's unfortunately not possible", with the recommendation
# being to avoid the apt path entirely. actions/runner-images #11347 reports the
# same hang running ~4 HOURS before cancellation.
#
# --with-deps IS UNNECESSARY HERE. The ubuntu-latest image ships Chrome,
# Chromium, Edge and Firefox preinstalled, so the shared libraries Playwright
# asks apt for (libnss3, libatk-bridge2.0-0, libdrm2, libxcomposite1,
# libxdamage1, libxrandr2, libgbm1) are already present. The apt call was
# reinstalling what the image already had, and it was the only unreliable step
# in the job.
#
# THE OFFICIAL PLAYWRIGHT CONTAINER was considered and REJECTED, which is the
# other remedy the 2026 sources recommend. mcr.microsoft.com/playwright ships
# browsers and deps preinstalled and removes apt the same way -- but this job
# drives docker compose build/up and docker exec against the host daemon, and
# running that from inside a container needs docker-in-docker. Trading a flaky
# apt for a socket-mount is a larger blast radius than the problem.
#
# THE STEP IS BOUNDED so a future stall fails fast and legibly rather than
# eating the job's whole budget. A browser download is seconds on a warm cache
# and under two minutes cold; five minutes is generous and still 6x tighter than
# the job ceiling that previously absorbed the hang.
name: E2E (Playwright)
on:
  push:
    branches: [main, develop]
  workflow_dispatch:
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  playwright:
    name: Playwright Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The e2e specs import @fleet/sync-protocol (the export-header SSOT) at the
      # Playwright-host level. Its dist/ is gitignored and built per-job, so build it
      # (and any workspace deps it needs) before Playwright resolves the import.
      - run: pnpm --filter @fleet/sync-protocol... run build
      # Browser binaries only. NO --with-deps: see the header note -- that flag
      # calls apt-get, which hung this job twice at the 30-minute ceiling on an
      # unreachable azure.archive.ubuntu.com mirror, and the libraries it
      # installs already ship in the ubuntu-latest image.
      #
      # Cached by Playwright version, so a warm runner skips the download
      # entirely and a version bump invalidates the key by construction.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-playwright-
      - name: Install Chromium (no apt)
        timeout-minutes: 5
        run: pnpm exec playwright install chromium
      - name: Generate ephemeral ES256 keypair + disposable .env
        run: |
          openssl ecparam -name prime256v1 -genkey -noout -out /tmp/ec-priv.pem
          openssl pkcs8 -topk8 -nocrypt -in /tmp/ec-priv.pem -out /tmp/jwt-priv.pem
          openssl ec -in /tmp/ec-priv.pem -pubout -out /tmp/jwt-pub.pem
          python3 .github/scripts/write-e2e-env.py

      # Bringup dumps its OWN diagnostics: this step is where a boot crash kills
      # the job, so it is the only place the evidence is still reachable. Every
      # diagnostic is || true so a missing container or docker hiccup can never
      # mask the real failure, and the step still exits 1 afterwards.
      - name: Bring up the Compose stack (no cache)
        run: |
          docker compose build --no-cache api ops-web
          if ! docker compose up -d postgres redis mock-oauth2 localstack api worker ops-web; then
            echo '::group::container state (docker ps -a)'
            docker ps -a || true
            echo '::endgroup::'
            echo '::group::container logs'
            docker compose logs --tail 200 api ops-web worker postgres mock-oauth2 || true
            echo '::endgroup::'
            echo '::error::compose bringup failed -- container state and logs above'
            exit 1
          fi
      - name: Wait for stack health
        run: |
          for i in $(seq 1 60); do
            if docker exec fleet-pilot-postgres-1 pg_isready -U fleet >/dev/null 2>&1 && curl -fsS http://localhost:3001 >/dev/null 2>&1; then
              echo "stack ready after $i polls"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "stack did not become ready"
              docker ps -a || true
              docker compose logs --tail 200 api ops-web worker postgres mock-oauth2 || true
              exit 1
            fi
            sleep 5
          done
      - name: Run Playwright tests against the live stack
        env:
          E2E_BASE_URL: http://localhost:3001
          E2E_API_URL: http://localhost:3000
          # The login spec asserts that startLogin's server-action redirect points
          # at the IdP authorize endpoint. It reads OIDC_AUTHORIZATION_ENDPOINT
          # from its own process env; this MUST match what the Compose ops-web is
          # configured to redirect to (compose.yaml ops-web env), i.e. the
          # mock-oauth2 authorize URL. Without it the test would fall back to the
          # playwright.config.ts placeholder and mismatch the real redirect.
          OIDC_AUTHORIZATION_ENDPOINT: http://localhost:8080/fleet/authorize
        run: pnpm test:e2e
      # Supplement, never the only capture: this covers failures AFTER bringup
      # (a Playwright crash, a mid-run container death). ps -a comes first,
      # because a container that already exited explains more than its log tail.
      - name: Dump container logs on failure
        if: failure()
        run: |
          docker ps -a || true
          docker compose logs --tail 200 api ops-web worker postgres mock-oauth2 || true
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

  # On a green E2E run for a develop push, dispatch the promote workflow (see
  # the matching job in ci.yml and the rationale in promote.yml's header). Each
  # of CI and E2E dispatches independently; promote.yml re-verifies BOTH are
  # green for develop's head before promoting, so double-dispatch is safe and
  # produces no skipped runs.
  dispatch-promote:
    name: Dispatch promote (develop, on success)
    needs: [playwright]
    if: >-
      success() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch promote.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh workflow run promote.yml --repo "$GITHUB_REPOSITORY" --ref develop
          echo 'Dispatched promote.yml (E2E green on develop).'

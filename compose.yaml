# compose.yaml
# Root docker-compose for end-to-end verification of the Fleet pilot stack.
# Services: postgres (PostGIS), redis, api (NestJS), worker (BullMQ), ops-web (Next.js).
# Day-one pilot scope per Frozen Stack PDF Day-One #10.
name: ${FLEET_COMPOSE_PROJECT:-fleet-pilot}
services:
  postgres:
    image: postgis/postgis:18-3.6-alpine
    environment:
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: fleet # pragma: allowlist secret
      POSTGRES_DB: fleet
    ports:
      - '${FLEET_PORT_POSTGRES:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql
    # -h 127.0.0.1 is load-bearing, not cosmetic. The docker-entrypoint
    # does an INTERNAL start for initdb/setup that listens on the unix
    # socket only (listen_addresses=localhost), then restarts the real
    # server. A socket-only pg_isready passes against THAT instance, or
    # inside the restart window, so compose reports healthy while the
    # next TCP connection gets 57P03 the database system is starting up --
    # which is how the api container died on its first Drizzle migration
    # (run 30947120064). PostgreSQL BUG #15222 documents the same window.
    # Forcing TCP means the check cannot see the init-time server at all,
    # and the SELECT 1 proves the target role and database actually work,
    # not merely that a socket answers.
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -U fleet -d fleet && psql -h 127.0.0.1 -U fleet -d fleet -c "SELECT 1"
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    ports:
      - '${FLEET_PORT_REDIS:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
  mock-oauth2:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10
    hostname: mock-oauth2
    environment:
      SERVER_HOSTNAME: mock-oauth2
      JSON_CONFIG: '{"tokenProvider":{"keyProvider":{"algorithm":"ES256"}},"interactiveLogin":false,"tokenCallbacks":[{"issuerId":"fleet","tokenExpiry":86400,"requestMappings":[{"requestParam":"username","match":"dispatcher","claims":{"sub":"00000000-0000-0000-0000-0000000000aa","operator_id":"00000000-0000-0000-0000-0000000000aa","company_id":"00000000-0000-0000-0000-000000000000","aud":"fleet-pilot","preferred_username":"dispatcher","acr":"aal2","amr":["pwd","hwk"]}},{"requestParam":"username","match":"dieuxe","claims":{"sub":"00000000-0000-0000-0000-0000000000bb","operator_id":"00000000-0000-0000-0000-0000000000bb","company_id":"00000000-0000-0000-0000-000000000000","aud":"fleet-pilot","preferred_username":"dieuxe"}},{"requestParam":"username","match":"driver1","claims":{"sub":"00000000-0000-0000-0000-000000000001","operator_id":"00000000-0000-0000-0000-000000000001","company_id":"00000000-0000-0000-0000-000000000000","aud":"fleet-pilot","preferred_username":"driver1"}},{"requestParam":"username","match":"driver2","claims":{"sub":"00000000-0000-0000-0000-000000000002","operator_id":"00000000-0000-0000-0000-000000000002","company_id":"00000000-0000-0000-0000-000000000000","aud":"fleet-pilot","preferred_username":"driver2"}},{"requestParam":"username","match":"driver3","claims":{"sub":"00000000-0000-0000-0000-000000000003","operator_id":"00000000-0000-0000-0000-000000000003","company_id":"00000000-0000-0000-0000-000000000000","aud":"fleet-pilot","preferred_username":"driver3"}},{"requestParam":"username","match":"driver4","claims":{"sub":"00000000-0000-0000-0000-000000000004","operator_id":"00000000-0000-0000-0000-000000000004","company_id":"00000000-0000-0000-0000-000000000000","aud":"fleet-pilot","preferred_username":"driver4"}},{"requestParam":"username","match":"driver5","claims":{"sub":"00000000-0000-0000-0000-000000000005","operator_id":"00000000-0000-0000-0000-000000000005","company_id":"00000000-0000-0000-0000-000000000000","aud":"fleet-pilot","preferred_username":"driver5"}},{"requestParam":"client_id","match":"fleet-worker","claims":{"sub":"00000000-0000-0000-0000-0000000000cc","operator_id":"00000000-0000-0000-0000-0000000000cc","company_id":"00000000-0000-0000-0000-000000000000","aud":"fleet-pilot","preferred_username":"fleet-worker"}},{"requestParam":"client_id","match":"ops-web","claims":{"sub":"00000000-0000-0000-0000-0000000000aa","operator_id":"00000000-0000-0000-0000-0000000000aa","company_id":"00000000-0000-0000-0000-000000000000","aud":"fleet-pilot","preferred_username":"dispatcher","acr":"aal3","idp":"google","amr":["hwk"]}}]},{"issuerId":"wrong-aud","tokenExpiry":86400,"requestMappings":[{"requestParam":"scope","match":"*","claims":{"sub":"00000000-0000-0000-0000-0000000000aa","operator_id":"00000000-0000-0000-0000-0000000000aa","company_id":"00000000-0000-0000-0000-000000000000","aud":"some-other-app"}}]}]}'
    ports:
      - '${FLEET_PORT_OAUTH:-8080}:8080'
  localstack:
    image: localstack/localstack:3.8
    environment:
      SERVICES: s3
      DEBUG: '0'
    ports:
      - '${FLEET_PORT_S3:-4566}:4566'
    healthcheck:
      test: ['CMD-SHELL', 'awslocal s3 ls || exit 1']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    volumes:
      - ./infra/localstack-init:/etc/localstack/init/ready.d:ro
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mock-oauth2:
        condition: service_started
      localstack:
        condition: service_healthy
    # JWT_*_PEM are multi-line secrets. Interpolating them via \${...} into the
    # environment block makes compose re-escape the leading dash of the PEM
    # header (\-----BEGIN...), which breaks importPKCS8. env_file passes the
    # .env values to the container verbatim, with no YAML re-escaping.
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PORT: '3000'
      DATABASE_URL: postgres://fleet:fleet@postgres:5432/fleet # pragma: allowlist secret
      REDIS_URL: redis://redis:6379
      DB_AUTO_MIGRATE: 'true'
      OIDC_ISSUER: http://mock-oauth2:8080/fleet
      OIDC_AUDIENCE: fleet-pilot
      OIDC_JWKS_URI: http://mock-oauth2:8080/fleet/jwks
      JWT_ISSUER: fleet-pilot-api
      JWT_AUDIENCE: fleet-driver
      AWS_REGION: us-west-2
      S3_ARTIFACTS_BUCKET: fleet-pilot-artifacts
      S3_ENDPOINT_URL: http://localstack:4566
      # Browser-reachable S3 origin for presigned PUT URLs. The driver-app web
      # bundle runs in the host browser and cannot resolve the internal
      # "localstack" hostname, so presigned URLs are rewritten to this origin.
      S3_PUBLIC_URL: http://localhost:${FLEET_PORT_S3:-4566}
      AWS_ACCESS_KEY_ID: test # pragma: allowlist secret
      AWS_SECRET_ACCESS_KEY: test # pragma: allowlist secret
      OTEL_ENABLED: 'false'
      FLEET_PILOT_SCOPE: '00000000-0000-0000-0000-000000000000'
    ports:
      - '${FLEET_PORT_API:-3000}:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
      mock-oauth2:
        condition: service_started
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://fleet:fleet@postgres:5432/fleet # pragma: allowlist secret
      REDIS_URL: redis://redis:6379
      # S3 intake enrichment (worker HEADs the uploaded object): without these
      # the object store is never constructed and intake fail-closes with
      # rejected:object_missing even though the object exists. In-network
      # endpoint (localstack:4566) per split-horizon LocalStack pattern; the
      # api keeps S3_PUBLIC_URL for browser-reachable presigned URLs.
      AWS_REGION: us-west-2
      S3_ARTIFACTS_BUCKET: fleet-pilot-artifacts
      S3_ENDPOINT: http://localstack:4566
      AWS_ACCESS_KEY_ID: test # pragma: allowlist secret
      AWS_SECRET_ACCESS_KEY: test # pragma: allowlist secret
      # Intake finalize callback (worker -> POST /upload/intake-result). Without
      # FLEET_API_URL + the WORKER_OIDC_* trio, main.ts never constructs the
      # callback: intake computes a verdict but the manifest stays verifying
      # forever. Auth is OAuth2 client-credentials (RFC 6749 s4.4) against the
      # local mock-oauth2 token endpoint -- the provider mints short-lived
      # tokens on demand (cached, single-flight, 60s pre-expiry buffer),
      # replacing the static WORKER_FLEET_API_TOKEN whose silent decay stalled
      # 65 manifests in verifying (Jun-24 incident). No token literals anywhere.
      FLEET_API_URL: http://api:3000
      WORKER_OIDC_TOKEN_URL: http://mock-oauth2:8080/fleet/token
      WORKER_OIDC_CLIENT_ID: fleet-worker
      # Interpolated from the gitignored repo-root .env (mock-oauth2 accepts
      # any client credential locally) -- no credential literal in the tree.
      WORKER_OIDC_CLIENT_SECRET: ${WORKER_OIDC_CLIENT_SECRET:-}
      # Phieu-can net-weight extraction (Gemini VLM). KEY interpolates from the
      # gitignored repo-root .env -- never commit literals; unset/empty =>
      # config treats as absent and main.ts skips the VLM port (jobs complete
      # as 'ports not configured'). MODEL default gemini-3.5-flash
      # (accuracy-critical kg; override in .env for cost A/B).
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
  driver-app:
    build:
      context: .
      dockerfile: apps/driver-app/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    environment:
      # HOST_LAN_IP is the dev host's LAN IP (set in repo-root .env).
      # The phone running Expo Go fetches the JS bundle and hits this API,
      # so both URLs must resolve from the phone's perspective on the LAN.
      EXPO_PUBLIC_API_URL: http://${HOST_LAN_IP}:${FLEET_PORT_API:-3000}
      # Tells Metro which hostname to advertise in the QR code / bundle URL.
      # Without this, Metro picks the container's internal Docker IP, which
      # the phone cannot reach, so the JS bundle never downloads and the
      # app (including the login screen) never mounts.
      REACT_NATIVE_PACKAGER_HOSTNAME: ${HOST_LAN_IP}
    ports:
      - '${FLEET_PORT_EXPO_METRO:-8081}:8081'
      - '${FLEET_PORT_EXPO_DEV:-19000}:19000'
      - '${FLEET_PORT_EXPO_DEV2:-19001}:19001'
  ops-web:
    build:
      context: .
      dockerfile: Dockerfile
      target: ops-web
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: '3001'
      HOSTNAME: '0.0.0.0'
      FLEET_API_URL: http://api:3000
      OIDC_TOKEN_ENDPOINT: http://mock-oauth2:8080/fleet/token
      OIDC_AUTHORIZATION_ENDPOINT: http://localhost:${FLEET_PORT_OAUTH:-8080}/fleet/authorize
      OIDC_CLIENT_ID: ops-web
      OIDC_REDIRECT_URI: http://localhost:${FLEET_PORT_OPS_WEB:-3001}/api/auth/callback
      # Server-action auth for assign-run: a dispatcher-scope JWT minted from
      # the local mock-oauth2 (/fleet/token, 1-day exp). The VALUE lives in the
      # gitignored repo-root .env as OPS_WEB_FLEET_API_TOKEN (compose ${}
      # interpolation) -- never commit token literals. Re-mint when expired:
      # docker exec fleet-pilot-api-1 node -e "<fetch /fleet/token script>" (see
      # context/proof-pipeline-env-and-url-horizons.md).
      FLEET_API_TOKEN: ${OPS_WEB_FLEET_API_TOKEN}
    ports:
      - '${FLEET_PORT_OPS_WEB:-3001}:3001'
volumes:
  pgdata:

# compose.yaml
# Root docker-compose for end-to-end verification of the Fleet pilot stack.
# Services: postgres (PostGIS), redis, api (NestJS), worker (BullMQ), ops-web (Next.js).
# Day-one pilot scope per Frozen Stack PDF Day-One #10.
name: fleet-pilot

services:
  postgres:
    image: postgis/postgis:15-3.4-alpine
    environment:
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: fleet  # pragma: allowlist secret
      POSTGRES_DB: fleet
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet -d fleet"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mock-oauth2:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10
    hostname: mock-oauth2
    environment:
      SERVER_HOSTNAME: mock-oauth2
      JSON_CONFIG: '{"tokenProvider":{"keyProvider":{"algorithm":"ES256"}},"interactiveLogin":false,"tokenCallbacks":[{"issuerId":"fleet","tokenExpiry":86400,"requestMappings":[{"requestParam":"username","match":"dispatcher","claims":{"sub":"00000000-0000-0000-0000-0000000000aa","operator_id":"00000000-0000-0000-0000-0000000000aa","company_id":"00000000-0000-0000-0000-000000000000","aud":"fleet-pilot","preferred_username":"dispatcher"}},{"requestParam":"username","match":"dieuxe","claims":{"sub":"00000000-0000-0000-0000-0000000000bb","operator_id":"00000000-0000-0000-0000-0000000000bb","company_id":"00000000-0000-0000-0000-000000000000","aud":"fleet-pilot","preferred_username":"dieuxe"}},{"requestParam":"username","match":"driver1","claims":{"sub":"00000000-0000-0000-0000-000000000001","operator_id":"00000000-0000-0000-0000-000000000001","company_id":"00000000-0000-0000-0000-000000000000","aud":"fleet-pilot","preferred_username":"driver1"}},{"requestParam":"username","match":"driver2","claims":{"sub":"00000000-0000-0000-0000-000000000002","operator_id":"00000000-0000-0000-0000-000000000002","company_id":"00000000-0000-0000-0000-000000000000","aud":"fleet-pilot","preferred_username":"driver2"}},{"requestParam":"username","match":"driver3","claims":{"sub":"00000000-0000-0000-0000-000000000003","operator_id":"00000000-0000-0000-0000-000000000003","company_id":"00000000-0000-0000-0000-000000000000","aud":"fleet-pilot","preferred_username":"driver3"}},{"requestParam":"username","match":"driver4","claims":{"sub":"00000000-0000-0000-0000-000000000004","operator_id":"00000000-0000-0000-0000-000000000004","company_id":"00000000-0000-0000-0000-000000000000","aud":"fleet-pilot","preferred_username":"driver4"}},{"requestParam":"username","match":"driver5","claims":{"sub":"00000000-0000-0000-0000-000000000005","operator_id":"00000000-0000-0000-0000-000000000005","company_id":"00000000-0000-0000-0000-000000000000","aud":"fleet-pilot","preferred_username":"driver5"}}]},{"issuerId":"wrong-aud","tokenExpiry":86400,"requestMappings":[{"requestParam":"scope","match":"*","claims":{"sub":"00000000-0000-0000-0000-0000000000aa","operator_id":"00000000-0000-0000-0000-0000000000aa","company_id":"00000000-0000-0000-0000-000000000000","aud":"some-other-app"}}]}]}'
    ports:
      - "8080:8080"
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mock-oauth2:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgres://fleet:fleet@postgres:5432/fleet  # pragma: allowlist secret
      REDIS_URL: redis://redis:6379
      DB_AUTO_MIGRATE: "true"
      OIDC_ISSUER: http://mock-oauth2:8080/fleet
      OIDC_AUDIENCE: fleet-pilot
      OIDC_JWKS_URI: http://mock-oauth2:8080/fleet/jwks
      JWT_PRIVATE_KEY_PEM: ${JWT_PRIVATE_KEY_PEM}
      JWT_PUBLIC_KEY_PEM: ${JWT_PUBLIC_KEY_PEM}
      JWT_ISSUER: fleet-pilot-api
      JWT_AUDIENCE: fleet-driver
      AWS_REGION: us-west-2
      S3_ARTIFACTS_BUCKET: fleet-pilot-artifacts
      OTEL_ENABLED: "false"
      FLEET_PILOT_SCOPE: "00000000-0000-0000-0000-000000000000"
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://fleet:fleet@postgres:5432/fleet  # pragma: allowlist secret
      REDIS_URL: redis://redis:6379

  driver-app:
    build:
      context: .
      dockerfile: apps/driver-app/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    environment:
      EXPO_PUBLIC_API_URL: http://localhost:3000
      EXPO_PUBLIC_FLEET_API_TOKEN: eyJraWQiOiJmbGVldCIsInR5cCI6IkpXVCIsImFsZyI6IkVTMjU2In0..AlRrn_PliltGVIgOIcxH3u5hcTscQ7NchDtXW2C68PcJn-S4ApvIPkxiab50T-H1p09l495WZ0De8YzNbdZraw  # pragma: allowlist secret
    ports:
      - "8081:8081"

  ops-web:
    build:
      context: .
      dockerfile: Dockerfile
      target: ops-web
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3001"
      HOSTNAME: "0.0.0.0"
      FLEET_API_URL: http://api:3000
      OIDC_TOKEN_ENDPOINT: http://mock-oauth2:8080/fleet/token
      FLEET_API_TOKEN: eyJraWQiOiJmbGVldCIsInR5cCI6IkpXVCIsImFsZyI6IkVTMjU2In0..fZuhKFxSxMQQPrNOGbH6H0D-t--Q-ltBDFM7dtq3ov-lKELT6quMMzddYrpVkJmVZHfRje8kj0Z9oF1xf8h5hw  # pragma: allowlist secret
    ports:
      - "3001:3001"

volumes:
  pgdata:

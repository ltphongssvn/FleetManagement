# apps/driver-app/.maestro/driver-change-password.yaml
# Maestro E2E flow (RELEASE build): a driver changes their own password via the
# self-service Đổi mật khẩu screen, then the success banner confirms it
# round-tripped to the API.
#
# Critical user journey: an authenticated driver sets/changes their password
#   through the app UI (not seeding) and the change succeeds.
# Business invariant: the driver-app exposes a self-service password-change
#   screen that calls POST /driver/me/password (current+new); on success the
#   Đổi mật khẩu thành công banner renders.
#
# RELEASE-build model (NOT Expo Go): assembleRelease embeds the minified JS
# bundle and EXCLUDES expo-dev-menu/expo-dev-launcher (debug-only), so launchApp
# the real package id directly -- no Expo container, no exp:// openLink, no
# dev-menu onboarding sheet, no Tools FAB, no Metro dependency (Maestro #3041;
# expo/expo#44234). 2026 Maestro RN docs: "For EAS builds or standalone apps,
# use the standard launchApp with your Bundle ID or Package Name."
#
# clearState:true gives a deterministic logged-out start every run: the release
# app persists the auth token, so a bare launchApp would land on HOME and skip
# login. On Android clearState == pm clear (Maestro docs; OneUptime). Clears APP
# DATA only -- the baked EXPO_PUBLIC_API_URL + cleartext flag live in the APK,
# and hide_error_dialogs + adb reverse are device-level, so all survive.
#
# Selectors: on Android, RN testID does NOT set a resource-id for TextInput, and
# the submit Pressable renders as android.widget.Button whose accessibilityLabel
# is its only accessibility identity. Maestro text: matches text OR accessibility
# text, so phone/password/buttons are targeted by text:.
#
# Credentials via env so no secret is committed. Defaults exercise the pilot
# login driver. For a seeded E2E driver, pass MAESTRO_DRIVER_PHONE +
# MAESTRO_DRIVER_PASSWORD (current); MAESTRO_DRIVER_NEW_PASSWORD sets the new one.
appId: com.fleetmanagement.driver
---
- launchApp:
    clearState: true
# Software-rendered emulator can throw a transient System UI ANR during cold
# boot; dismiss it (tap Wait) if present. Harmless no-op when absent.
- tapOn:
    text: 'Wait'
    optional: true
# Mount signal: wait for the login SUBTITLE (not "Fleet Driver", which can show
# during the brief cold-boot splash) before interacting.
- extendedWaitUntil:
    visible: 'Đăng nhập để xem lệnh điều xe'
    timeout: 120000
# --- Log in with the CURRENT password ---
- tapOn:
    text: 'Số điện thoại'
- inputText: "${MAESTRO_DRIVER_PHONE ?? '0900000001'}"
- tapOn:
    text: 'Mật khẩu'
- inputText: "${MAESTRO_DRIVER_PASSWORD ?? 'driver1pass'}"
- hideKeyboard
- tapOn:
    text: 'Đăng nhập'
- extendedWaitUntil:
    visible: 'Trạng thái đồng bộ'
    timeout: 60000
# --- Open the self-service change-password screen ---
- tapOn:
    text: 'Đổi mật khẩu'
- extendedWaitUntil:
    visible: 'Mật khẩu hiện tại'
    timeout: 30000
- assertVisible: 'Mật khẩu mới'
# --- Submit current + new ---
- tapOn:
    text: 'Mật khẩu hiện tại'
- inputText: "${MAESTRO_DRIVER_PASSWORD ?? 'driver1pass'}"
- tapOn:
    text: 'Mật khẩu mới'
- inputText: "${MAESTRO_DRIVER_NEW_PASSWORD ?? 'driver1pass'}"
- hideKeyboard
- tapOn:
    text: 'Lưu mật khẩu'
# Success banner confirms the change round-tripped to the API.
- extendedWaitUntil:
    visible: 'Đổi mật khẩu thành công'
    timeout: 60000

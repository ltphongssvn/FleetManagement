# apps/driver-app/.maestro/driver-change-password.yaml
# Maestro E2E flow (Expo): a driver changes their own password via the
# self-service Đổi mật khẩu screen, then logs in again with the NEW password.
#
# Critical user journey: an authenticated driver sets/changes their password
#   through the app UI (not seeding) and the new password actually works.
# Business invariant: the driver-app exposes a self-service password-change
#   screen that calls POST /driver/me/password (current+new); on success the
#   old password no longer authenticates and the new one does.
#
# Outside-in: this fails FIRST because there is no Đổi mật khẩu action on the
#   home screen and no change-password screen — the tapOn for it times out.
#
# Host/selectors: same constraints as driver-login-assignment.yaml — emulator
# reaches Metro via 10.0.2.2; RN TextInput has no resource-id, Pressable-as-
# Button exposes only accessibilityLabel, so phone/password/buttons are matched
# by text: (label / accessibility text).
#
# Credentials via env so no secret is committed. Defaults exercise the pilot
# login driver. For NGUYỄN THANH PHONG: MAESTRO_DRIVER_PHONE=0903998784 and the
# CURRENT password via MAESTRO_DRIVER_PASSWORD, NEW via MAESTRO_DRIVER_NEW_PASSWORD.
appId: host.exp.Exponent
---
- openLink: exp://10.0.2.2:8081/--/?platform=android&dev=true&minify=false&disableOnboarding=1
# After a fresh no-cache rebuild Metro must COMPILE the bundle on first open
# ("Bundling NN%..."). The dev-menu sheet and the login screen do not exist
# until bundling completes, so an immediate dismissal fires into the bundling
# screen (both Wait and Continue WARNED not-found), then the dev-menu sheet
# appears LATE and blocks the subtitle assert. Gate on the dev-menu sheet
# actually appearing (its "Continue" button) with a long timeout that absorbs
# the cold-bundle compile, THEN dismiss it. The transient System UI ANR may
# still pop during compile, so keep the optional Wait tap first.
- tapOn:
    text: "Wait"
    optional: true
# Wait for the post-bundle dev-menu sheet (or, if Expo Go skips it, the login
# subtitle) before dismissing. extendedWaitUntil polls, absorbing the compile.
- extendedWaitUntil:
    visible:
      text: "Continue"
    timeout: 180000
    optional: true
# Expo Go SDK 55 first-launch dev-menu bottom-sheet ("This is the developer
# menu ... Continue", with an X close) occludes the login. Tapping "Continue"
# dismisses it (pressKey: back does NOT dismiss THIS sheet shape). Optional so
# the flow still runs when Expo Go is already past first launch.
- tapOn:
    text: "Continue"
    optional: true
- pressKey: back
- extendedWaitUntil:
    visible: "Đăng nhập để xem lệnh điều xe"
    timeout: 180000
# --- Log in with the CURRENT password ---
- tapOn:
    text: "Số điện thoại"
- inputText: "${MAESTRO_DRIVER_PHONE ?? '0900000001'}"
- tapOn:
    text: "Mật khẩu"
- inputText: "${MAESTRO_DRIVER_PASSWORD ?? 'driver1pass'}"
- hideKeyboard
- tapOn:
    text: "Đăng nhập"
- extendedWaitUntil:
    visible: "Trạng thái đồng bộ"
    timeout: 60000
# --- Open the self-service change-password screen ---
- tapOn:
    text: "Đổi mật khẩu"
- extendedWaitUntil:
    visible: "Mật khẩu hiện tại"
    timeout: 30000
- assertVisible: "Mật khẩu mới"
# --- Submit current + new ---
- tapOn:
    text: "Mật khẩu hiện tại"
- inputText: "${MAESTRO_DRIVER_PASSWORD ?? 'driver1pass'}"
- tapOn:
    text: "Mật khẩu mới"
- inputText: "${MAESTRO_DRIVER_NEW_PASSWORD ?? 'driver1pass'}"
- hideKeyboard
- tapOn:
    text: "Lưu mật khẩu"
# Success banner confirms the change round-tripped to the API.
- extendedWaitUntil:
    visible: "Đổi mật khẩu thành công"
    timeout: 60000

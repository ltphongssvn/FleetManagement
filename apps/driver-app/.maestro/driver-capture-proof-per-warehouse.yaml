# apps/driver-app/.maestro/driver-capture-proof-per-warehouse.yaml
# Maestro E2E: the driver app must capture a weighing photo as pickup/delivery
# proof at EACH destination warehouse of order XTT.06-001 (driver NGUYỄN THANH
# PHONG). XTT.06-001 has 4 pickup (loading) warehouses + 1 delivery (unloading)
# warehouse, so there must be a working per-warehouse capture (proof) screen for
# each: 4 loading receipts + 1 unloading receipt.
#
# Capture route (Expo Router): /capture?transportOrderId=<id>&stopKind=loading&
# stopIndex=0..3 (warehouses 1..4) or stopKind=unloading (single delivery). The
# screen renders a per-warehouse proof title + a camera button (Chụp ảnh):
#   loading  N -> 'Phiếu nhận hàng - Kho nhận hàng N'
#   unloading  -> 'Phiếu giao hàng - Kho dỡ hàng'
# This flow deep-links each of the 5 stops and asserts the correct proof screen
# + camera button, proving the driver can photograph loading/unloading proof at
# every warehouse. transportOrderId is XTT.06-001's UUID.
#
# Selector notes: Maestro text: is a FULL-ELEMENT regex, so titles use a .*
# suffix to match the whole node. Login uses runFlow-when (Expo Go persists the
# session across runs). Cold-start: double openLink + waitForAnimationToEnd with
# reactive overlay dismissal (no fragile blind Back).
appId: host.exp.exponent
---
- openLink: exp://10.0.2.2:8081/--/?platform=android&dev=true&minify=false&disableOnboarding=1
- waitForAnimationToEnd:
    timeout: 6000
- openLink: exp://10.0.2.2:8081/--/?platform=android&dev=true&minify=false&disableOnboarding=1
- waitForAnimationToEnd:
    timeout: 6000
- runFlow:
    when:
      visible: "Continue"
    commands:
      - pressKey: back
- runFlow:
    when:
      visible: "Reload"
    commands:
      - pressKey: back
- extendedWaitUntil:
    visible: "Đăng nhập để xem lệnh điều xe|Trạng thái đồng bộ"
    timeout: 180000
- runFlow:
    when:
      visible: "Đăng nhập để xem lệnh điều xe"
    commands:
      - tapOn:
          text: "Số điện thoại"
      - inputText: "${MAESTRO_DRIVER_PHONE ?? '0903998784'}"
      - tapOn:
          text: "Mật khẩu"
      - inputText: "${MAESTRO_DRIVER_PASSWORD ?? 'driver1pass'}"  # pragma: allowlist secret
      - hideKeyboard
      - tapOn:
          text: "Đăng nhập"
      - extendedWaitUntil:
          visible: "Trạng thái đồng bộ"
          timeout: 60000
# --- Warehouse 1 (loading) proof screen ---
- openLink: exp://10.0.2.2:8081/--/capture?transportOrderId=32e1d5a6-7f7d-4ce0-a3d1-c6db60c8986d&stopKind=loading&stopIndex=0
- extendedWaitUntil:
    visible: "Phiếu nhận hàng - Kho nhận hàng 1.*"
    timeout: 30000
- assertVisible: "Chụp ảnh phiếu nhận hàng tại kho nhận hàng 1.*"
- assertVisible: "Chụp ảnh"
# --- Warehouse 2 (loading) proof screen ---
- openLink: exp://10.0.2.2:8081/--/?platform=android&dev=true&minify=false&disableOnboarding=1
- waitForAnimationToEnd:
    timeout: 3000
- openLink: exp://10.0.2.2:8081/--/capture?transportOrderId=32e1d5a6-7f7d-4ce0-a3d1-c6db60c8986d&stopKind=loading&stopIndex=1
- extendedWaitUntil:
    visible: "Phiếu nhận hàng - Kho nhận hàng 2.*"
    timeout: 30000
- assertVisible: "Chụp ảnh"
# --- Warehouse 3 (loading) proof screen ---
- openLink: exp://10.0.2.2:8081/--/?platform=android&dev=true&minify=false&disableOnboarding=1
- waitForAnimationToEnd:
    timeout: 3000
- openLink: exp://10.0.2.2:8081/--/capture?transportOrderId=32e1d5a6-7f7d-4ce0-a3d1-c6db60c8986d&stopKind=loading&stopIndex=2
- extendedWaitUntil:
    visible: "Phiếu nhận hàng - Kho nhận hàng 3.*"
    timeout: 30000
- assertVisible: "Chụp ảnh"
# --- Warehouse 4 (loading) proof screen ---
- openLink: exp://10.0.2.2:8081/--/?platform=android&dev=true&minify=false&disableOnboarding=1
- waitForAnimationToEnd:
    timeout: 3000
- openLink: exp://10.0.2.2:8081/--/capture?transportOrderId=32e1d5a6-7f7d-4ce0-a3d1-c6db60c8986d&stopKind=loading&stopIndex=3
- extendedWaitUntil:
    visible: "Phiếu nhận hàng - Kho nhận hàng 4.*"
    timeout: 30000
- assertVisible: "Chụp ảnh"
# --- Delivery warehouse (unloading) proof screen ---
- openLink: exp://10.0.2.2:8081/--/?platform=android&dev=true&minify=false&disableOnboarding=1
- waitForAnimationToEnd:
    timeout: 3000
- openLink: exp://10.0.2.2:8081/--/capture?transportOrderId=32e1d5a6-7f7d-4ce0-a3d1-c6db60c8986d&stopKind=unloading
- extendedWaitUntil:
    visible: "Phiếu giao hàng - Kho dỡ hàng.*"
    timeout: 30000
- assertVisible: "Chụp ảnh phiếu giao hàng tại kho dỡ hàng.*"
- assertVisible: "Chụp ảnh"

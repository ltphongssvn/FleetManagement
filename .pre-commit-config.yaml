# ============================================================================
# File:     FleetManagement/.pre-commit-config.yaml
# Purpose:  Local Git hook configuration (via the pre-commit framework) that
#           enforces secret detection, file hygiene, and CI-mirroring quality
#           gates before code ever leaves a developer's machine.
#
# Why it exists:
#   The Frozen Stack (Fleet-Management-Stack.pdf) mandates strict secret
#   hygiene (vault-backed secrets, crypto-shred for PII, no credentials in
#   repo) and TDD as a first-class practice. This file is the LOCAL
#   enforcement layer — a fast-fail gate that blocks bad commits (secrets,
#   .env files, Terraform state, native signing material, merge conflict
#   markers, private keys) before they reach GitHub, and runs the same
#   lint/typecheck/test/build tasks that CI (.github/workflows/ci.yml) runs
#   so developers get CI-equivalent feedback in under a second when
#   possible. Hooks are wired to both pre-commit and pre-push stages; the
#   TDD + build gates run on pre-push (too slow for every commit).
#
# Critical bash-safety contract (2026-Q2 hardening):
#   Hook entries used to be written as:
#       bash -c 'cmd1 && cmd2 && cmd3 || echo "Skipped"'
#   Bash parses this as (cmd1 && cmd2 && cmd3) || echo, so when cmd3
#   (e.g. pnpm test:coverage) exits non-zero on a real failure, the echo
#   branch runs and the hook exits 0 — the failure is silently swallowed
#   and a broken commit gets pushed to CI. The fix is to gate the
#   skip-vs-run decision FIRST with an explicit if/then/else block, so a
#   real failure cleanly propagates its non-zero exit code:
#       bash -c 'if command -v pnpm >/dev/null && [ -f pnpm-lock.yaml ]; \
#         then pnpm -r --if-present <task>; \
#         else echo "Skipped (pre-scaffold or pnpm missing)"; fi'
#   This pattern is mandatory for every entry below that runs a pnpm task.
#
# Coverage gate parity with remote CI:
#   The remote CI workflow (.github/workflows/ci.yml#coverage-gate) merges
#   sharded coverage JSON via scripts/merge-coverage.mjs and enforces a
#   90/90/90/90 per-file threshold. Locally we run apps/api's coverage in
#   one pass (no shards), then invoke the same script on the single
#   coverage-final.json so the local gate exercises exactly the same
#   merge + threshold logic as CI. The pnpm-test-coverage-push hook does
#   both steps in a single bash entry: vitest --coverage, then merge.
#
#   Cross-worktree serialization (2026-Q3 hardening): this box runs up
#   to 6 parallel worktree terminals; N concurrent coverage gates (each
#   already intra-serialized via --workspace-concurrency=1) still starve
#   an 8-core host and stretch PGlite WASM cold-starts past any sane
#   hook budget (observed: import phase 1018s vs ~28s isolated). A
#   machine-global lock on $HOME/.cache/fleetmanagement queues gates
#   instead of letting them thrash each other. The lock lives under
#   $HOME, never repo-relative: worktrees have different paths, so a
#   repo-local lock serializes nothing.
#
# Related files:
#   - .secrets.baseline                  — detect-secrets allowlist
#   - SECURITY.md                        — policy rationale, IR
#   - .gitignore                         — passive ignore rules
#   - .github/workflows/ci.yml           — remote CI mirror
#   - scripts/merge-coverage.mjs         — coverage merge + 90/90/90/90 gate
#   - apps/api/vitest.coverage.config.ts — coverage config
#   - turbo.jsonc                        — task definitions
# ============================================================================
repos:
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        # --exclude-lines skips a SHAPE that is structurally not a secret,
        # wherever it appears. age PUBLIC keys are tracked in git ON PURPOSE
        # (.age-recipients is the recipient SSOT, .sops.yaml is generated from
        # it), and publishing one grants nothing -- that is the premise of the
        # scheme. Without this they land as Base64HighEntropyString findings.
        #
        # Baselining them instead would be a treadmill: the recipient list GROWS
        # by design, so every laptop ever added mints another finding, another
        # refresh and another audit round, forever, for values published
        # deliberately. A baseline crowded with benign entries is one nobody
        # reads, which is how a real finding slips past.
        #
        # SCOPE IS DELIBERATELY NARROW. Only the PUBLIC shape (age1 + 58 bech32
        # chars) is excluded. AGE-SECRET-KEY-* is NOT and must never be: a
        # private identity in tracked source is a genuine incident, and both
        # this plugin and the detect-private-key hook below must keep their shot
        # at it. The pattern is length-anchored so a short age-prefixed string
        # is still scanned.
        #
        # MUST STAY IN SYNC with EXCLUDE_LINE_PATTERNS in scripts/secrets-baseline.ts:
        # that task writes the baseline this hook then enforces, so a drift means
        # the task produces a baseline the hook rejects. Asserted by
        # scripts/secrets-baseline-age-keys.test.ts under //#test:scripts.
        args: ['--baseline', '.secrets.baseline', '--exclude-lines', 'age1[02-9ac-hj-np-z]{58}']
        exclude: (?x)(
            pnpm-lock\.yaml|
            .*\.lock|
            .*\.log|
            package-lock\.json|
            yarn\.lock|
            \.secrets\.baseline
          )$
  - repo: local
    hooks:
      - id: block-large-binaries
        name: Block Large Binary Files
        entry: sh -c 'git diff --cached --name-only | grep -qE "\.(h5|pkl|pth|onnx|parquet|sqlite3|ipa|apk|aab|keystore|jks|p8|p12|mobileprovision)$" && echo "ERROR - Large/native binary files detected. Remove with git rm --cached" && exit 1 || exit 0'
        language: system
        pass_filenames: false
      - id: check-env-files
        name: Block .env Files
        entry: sh -c 'git diff --cached --name-only | grep -vE "\.env\.example$" | grep -qE "(^|/)\.env(\..+)?$" && echo "ERROR - .env file detected. Never commit secrets! (.env.example is allowed)" && exit 1 || exit 0'
        language: system
        pass_filenames: false
      - id: block-terraform-state
        name: Block Terraform State & tfvars
        entry: sh -c 'git diff --cached --name-only | grep -vE "\.tfvars\.example$" | grep -qE "\.(tfstate|tfstate\.backup|tfvars)$" && echo "ERROR - Terraform state or tfvars detected. These contain secrets!" && exit 1 || exit 0'
        language: system
        pass_filenames: false
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: mixed-line-ending
        args: ['--fix=lf']
        name: Fix Line Endings to LF
      - id: end-of-file-fixer
        name: Fix End of Files
      - id: trailing-whitespace
        name: Trim Trailing Whitespace
      - id: check-json
        name: Validate JSON Files
      - id: check-yaml
        name: Validate YAML Files
        exclude: ^apps/driver-app/\.maestro/
      - id: check-added-large-files
        args: ['--maxkb=500']
        name: Check for Large Files
      - id: check-merge-conflict
        name: Check Merge Conflict Markers
      - id: check-case-conflict
        name: Check Case-Insensitive Filename Conflicts
      - id: detect-private-key
        name: Detect Private Keys
  - repo: local
    hooks:
      - id: pnpm-lint
        name: pnpm Lint (CI Mirror)
        entry: bash -c 'if command -v pnpm >/dev/null && [ -f pnpm-lock.yaml ]; then pnpm exec turbo run lint; else echo "Skipped (pre-scaffold or pnpm missing)"; fi'
        language: system
        pass_filenames: false
        types_or: [ts, tsx, javascript, jsx]
      - id: pnpm-typecheck
        name: pnpm Typecheck (CI Mirror)
        entry: bash -c 'if command -v pnpm >/dev/null && [ -f pnpm-lock.yaml ]; then pnpm exec turbo run typecheck; else echo "Skipped (pre-scaffold or pnpm missing)"; fi'
        language: system
        pass_filenames: false
        types_or: [ts, tsx]
      - id: e2e-typecheck
        name: E2E Typecheck (CI Mirror)
        entry: bash -c 'if command -v pnpm >/dev/null && [ -f e2e/tsconfig.json ]; then pnpm exec tsc --noEmit -p e2e/tsconfig.json; else echo "Skipped (no e2e project or pnpm missing)"; fi'
        language: system
        pass_filenames: false
        types_or: [ts, tsx]
  - repo: local
    hooks:
      - id: pnpm-build-push
        name: pnpm Build Verification (Pre-push)
        entry: bash -c 'if command -v pnpm >/dev/null && [ -f pnpm-lock.yaml ]; then pnpm exec turbo run build; else echo "Skipped (pre-scaffold or pnpm missing)"; fi'
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: pnpm-test-coverage-push
        name: pnpm Test Coverage + 90/90/90/90 Merge Gate (Pre-push, CI Mirror)
        # Mirrors remote CI .github/workflows/ci.yml#coverage-gate exactly:
        # apps/api test:coverage emits coverage/merged/coverage-final.json,
        # then scripts/merge-coverage.mjs is invoked on that single file to
        # enforce the 90/90/90/90 per-file gate via the same merge logic
        # CI uses across its 4 shards. Non-api packages run their own
        # test:coverage in the same -r pass so their per-package thresholds
        # apply too.
        #
        # THIN BY DESIGN. This entry used to inline the lock, the recursive
        # coverage run and the merge step as a ~300-character bash string --
        # untested, and unreachable by //#test:scripts. It streamed every
        # workspace's vitest output through pre-commit's captured pipe, and
        # twice on 2026-08-05 the pipe filled and the framework died with
        #   BlockingIOError: [Errno 11] write could not complete without blocking
        # aborting a push while the tests were PASSING.
        #
        # The gate now lives in scripts/gate-coverage.ts, where its argv is
        # unit-tested: the lock wait, --workspace-concurrency=1, the log file
        # that keeps the pipe from filling, and the same 90/90/90/90 merge. One
        # place to change behaviour, and a test that fails if someone drops the
        # lock or weakens the run.
        entry: bash -c 'if command -v pnpm >/dev/null && [ -f pnpm-lock.yaml ]; then pnpm run gate:coverage; else echo "Skipped (pre-scaffold or pnpm missing)"; fi'
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: estate-verify-push
        name: Estate Verify (Pre-push, local estate only)
        # LEVEL 5 of the load-bearing ladder: the task existed, was registered
        # in turbo.jsonc with graded exits, failed closed, and emitted evidence
        # -- and NOTHING INVOKED IT. A verdict nobody consumes is decorative,
        # however sound its internals. This is the same hole ci.yml documents
        # three times (//#lint:scripts, //#typecheck:scripts, //#lint:e2e):
        # a check real in principle and absent in practice.
        #
        # PRE-PUSH, AND DELIBERATELY NOT CI. The estate it inspects is the
        # LOCAL one -- dirty trees, stashes, unpushed commits across every
        # worktree on this machine. A CI runner is a fresh shallow clone with
        # exactly one worktree, so the verdict there is vacuous; wiring it into
        # __ci_fast__ would be cargo-culting the shape of a gate. 2026 guidance
        # splits precisely this way: environment-dependent local state belongs
        # in the hook, while CI stays authoritative for what a laptop cannot
        # reproduce. What CI already defends is the MECHANISM -- security-guards
        # runs test:scripts, which covers every estate suite, so weakening the
        # classifier turns the PR red (ladder level 8).
        #
        # --pushing IS LOAD-BEARING, and it resolves a DEADLOCK observed
        # 2026-08-18. Without it this hook refused the push because the worktree
        # BEING PUSHED reported `unpushed` -- and pushing is the only cure for
        # unpushed, so the gate could never be satisfied by the operation it
        # gates. Worse, the reasons are estate-wide, so ANY worktree holding an
        # unpushed commit blocked every OTHER worktree's push: six terminals
        # mutually locked by design. It hid for weeks because the gate passes
        # whenever the estate happens to be fully pushed, which is exactly the
        # moment nobody is trying to push.
        #
        # The flag selects PUSH_POLICY, which suppresses `unpushed` AND NOTHING
        # ELSE: dirty, stash, prunable and locked still block, because pushing
        # resolves none of them. The relaxation is a POLICY rather than a
        # special case in this entry, so it is versioned, digested, and named on
        # every emitted event -- a consumer can see that PROCEED was reached
        # under relaxed rules rather than having to trust it.
        #
        # The hook is bypassable with --no-verify, which is exactly why it is
        # the LOCAL half of a pair rather than the whole control.
        #
        # Exit 1 (not clean) blocks the push; exit 3 (unreadable) blocks it too,
        # because an estate that cannot be read must never be assumed clean.
        entry: bash -c 'if command -v pnpm >/dev/null && [ -f pnpm-lock.yaml ]; then pnpm exec turbo run estate:verify -- --quiet --pushing; else echo "Skipped (pre-scaffold or pnpm missing)"; fi'
        language: system
        pass_filenames: false
        stages: [pre-push]
      # NOTE: pnpm-test-mutation is intentionally NOT wired to pre-push.
      # Stryker mutation testing on apps/api takes ~34 minutes wall time
      # and on apps/ops-web ~7 minutes — combined with the other 5
      # packages, a pre-push run would block developers for >45 minutes.
      # Mutation testing should run in CI on a scheduled basis (nightly)
      # or be invoked manually with `pnpm -r --if-present test:mutation`
      # when working on hardening a specific package. Each package's
      # stryker.config.json owns its break threshold (90% for the small
      # packages, 60% for apps/api + apps/ops-web during the baseline
      # phase).
  - repo: local
    hooks:
      - id: commitlint
        name: Conventional Commits (commitlint)
        entry: bash -c 'if command -v pnpm >/dev/null && [ -f pnpm-lock.yaml ]; then pnpm exec commitlint --edit "$1"; else echo "Skipped (pre-scaffold or pnpm missing)"; fi' --
        language: system
        stages: [commit-msg]
        pass_filenames: false

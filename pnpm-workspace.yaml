# ============================================================================
# File:     FleetManagement/pnpm-workspace.yaml
# Purpose:  Declares the pnpm workspace topology for the FleetManagement
#           monorepo — the set of directories pnpm treats as linked packages
#           and manages via a single lockfile and shared node_modules store.
#
# Why it exists:
#   The Frozen Stack (Fleet-Management-Stack.pdf) mandates "pnpm workspaces
#   + Turborepo; Node/TS only" and prescribes the exact top-level layout:
#     apps/driver-app   — Expo native (phones + Android tablets)
#     apps/ops-web      — Next.js App Router + shadcn/ui + Tailwind
#     apps/api          — NestJS modular monolith + Socket.IO gateway
#     workers/main-worker — single deployment with named BullMQ queues
#     packages/@domain  — state machines + policies
#     packages/@sync-protocol, @api-sdk, @design-tokens,
#              @test-fixtures, @i18n
#   pnpm needs this file (NOT the package.json "workspaces" field, which it
#   ignores) to resolve workspace:* protocol links, run \`pnpm -r <script>\`
#   across packages, and generate a unified pnpm-lock.yaml. Without it,
#   Turborepo's workspace-aware task graph cannot function.
#
# Key decisions / invariants:
#   - Three top-level glob patterns matching the PDF's mandated layout:
#     apps/*, workers/*, packages/*. No nested globs (apps/*/*) — keeps
#     the topology flat and predictable.
#   - Filename MUST be pnpm-workspace.yaml (pnpm rejects .yml).
#   - As of pnpm 11, the package manager no longer reads the "pnpm" field
#     in package.json. allowBuilds (formerly pnpm.onlyBuiltDependencies)
#     and overrides (formerly pnpm.overrides) now live in this file.
#
# Related files:
#   - package.json              — packageManager field, root scripts
#   - turbo.jsonc               — task graph that iterates these workspaces
#   - .github/workflows/ci.yml  — runs \`pnpm install --frozen-lockfile\`
#   - .gitignore                — excludes node_modules, .pnpm-store
# ============================================================================
packages:
  - "apps/*"
  - "workers/*"
  - "packages/*"
  # The top-level Playwright acceptance suite is a first-class workspace member
  # (@fleet/e2e) so its specs IMPORT shared contracts (e.g. the export-header SSOT)
  # via the workspace: protocol instead of re-declaring them and drifting.
  - "e2e"
# Single source of truth for the Zod version across every workspace package.
# All @fleet/* packages reference this via the catalog: protocol in their
# package.json (dependencies AND devDependencies), so the entire monorepo
# resolves ONE Zod, and a version bump is a one-line change here. Pinned to the
# latest stable Zod 4 (4.x is now published at the package root and is the 2026
# ecosystem standard). Exact (not ^) so the resolved version is deterministic.
catalog:
  zod: 4.4.3
# Dependencies permitted to run install/build lifecycle scripts. pnpm 11
# blocks all build scripts by default; these are the packages that
# legitimately need to compile native addons or download prebuilt binaries.
allowBuilds:
  "@nestjs/core": true
  "@sentry/cli": true
  cpu-features: true
  dtrace-provider: false
  esbuild: true
  msgpackr-extract: true
  protobufjs: true
  sharp: true
  ssh2: true
# Transitive-dependency version pins (security floors + tooling alignment).
overrides:
  "vite@<8.0.16": ">=8.0.16"
  esbuild: ">=0.28.1"
  postcss: ">=8.5.10"
  uuid: ">=14.0.0"
  vitest: "4.1.5"
  "@vitest/coverage-v8": "4.1.5"
  "@vitest/coverage-istanbul": "4.1.5"
  fast-uri: ">=3.1.2"
  fast-xml-builder: ">=1.1.7"
  next: ">=16.2.5"
  "@opentelemetry/auto-instrumentations-node": ">=0.75.0"
  "@opentelemetry/sdk-node": ">=0.217.0"
  "protobufjs@<7.5.6": ">=7.5.6"
  "protobufjs@>=8.0.0 <=8.0.1": ">=8.0.2"
  glob: ">=10.0.0"
  rimraf: ">=4.0.0"
  "@ungap/structured-clone": ">=1.3.0"
  tmp: ">=0.2.6"
  brace-expansion: ">=5.0.6"
  ws: ">=8.20.1"
  protobufjs: ">=8.2.0"
  "@expo/dom-webview": "55.0.6"
  qs: ">=6.15.2"
  shell-quote: ">=1.8.4"
  '@grpc/grpc-js@>=1.14.0 <1.14.4': ^1.14.4
  '@babel/core@<=7.29.0': ^7.29.1
  '@opentelemetry/core@<2.8.0': ^2.8.0
  form-data@>=4.0.0 <4.0.6: ^4.0.6
  js-yaml@<=4.1.1: ^4.1.2
  protobufjs@>=8.0.0 <=8.5.0: ^8.5.1
  protobufjs@>=8.2.0 <=8.4.2: ^8.4.3
  tmp@>=0.2.6 <0.2.7: ^0.2.7
  vite: ">=8.0.16"
  multer: ">=2.2.0"
  # GHSA-vmh5-mc38-953g: undici 7.23.0-7.27.x SOCKS5 ProxyAgent TLS bypass.
  # Transitive via @semantic-release/github + testcontainers; scoped to the
  # vulnerable 7.x range so undici 6.x (via @semantic-release/npm) is untouched.
  "undici@>=7.23.0 <7.28.0": ">=7.28.0"
  # GHSA-vxpw-j846-p89q: undici <6.27.0 WebSocket DoS via fragment count
  # bypass. Transitive via @semantic-release/* -> @actions/http-client (the
  # 6.x path the 7.x pin above intentionally left alone). Dev-only (Release
  # CI job). Scoped to the vulnerable 6.x range so other majors are untouched.
  "undici@<6.27.0": ">=6.27.0"
minimumReleaseAgeExclude:
  - tmp@0.2.6 || 0.2.7
  - '@grpc/grpc-js@1.14.4'
  - protobufjs@8.4.3 || 8.5.1
  - form-data@4.0.6
  - vite@8.0.16
  - js-yaml@4.1.2
  - '@babel/core@7.29.1'
  - '@opentelemetry/core@2.8.0'
  - multer@2.2.0
  - undici@6.27.0 || 7.28.0
  - '@turbo/darwin-64@2.10.2 || 2.10.3'
  - '@turbo/darwin-arm64@2.10.2 || 2.10.3'
  - '@turbo/linux-64@2.10.2 || 2.10.3'
  - '@turbo/linux-arm64@2.10.2 || 2.10.3'
  - '@turbo/windows-64@2.10.2 || 2.10.3'
  - '@turbo/windows-arm64@2.10.2 || 2.10.3'
  - turbo@2.10.2 || 2.10.3

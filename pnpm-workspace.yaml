# ============================================================================
# File:     FleetManagement/pnpm-workspace.yaml
# Purpose:  Declares the pnpm workspace topology for the FleetManagement
#           monorepo — the set of directories pnpm treats as linked packages
#           and manages via a single lockfile and shared node_modules store.
#
# Why it exists:
#   The Frozen Stack (Fleet-Management-Stack.pdf) mandates "pnpm workspaces
#   + Turborepo; Node/TS only" and prescribes the exact top-level layout:
#     apps/driver-app   — Expo native (phones + Android tablets)
#     apps/ops-web      — Next.js App Router + shadcn/ui + Tailwind
#     apps/api          — NestJS modular monolith + Socket.IO gateway
#     workers/main-worker — single deployment with named BullMQ queues
#     packages/@domain  — state machines + policies
#     packages/@sync-protocol, @api-sdk, @design-tokens,
#              @test-fixtures, @i18n
#   pnpm needs this file (NOT the package.json "workspaces" field, which it
#   ignores) to resolve workspace:* protocol links, run \`pnpm -r <script>\`
#   across packages, and generate a unified pnpm-lock.yaml. Without it,
#   Turborepo's workspace-aware task graph cannot function.
#
# Key decisions / invariants:
#   - Three top-level glob patterns matching the PDF's mandated layout:
#     apps/*, workers/*, packages/*. No nested globs (apps/*/*) — keeps
#     the topology flat and predictable.
#   - Filename MUST be pnpm-workspace.yaml (pnpm rejects .yml).
#   - As of pnpm 11, the package manager no longer reads the "pnpm" field
#     in package.json. allowBuilds (formerly pnpm.onlyBuiltDependencies)
#     and overrides (formerly pnpm.overrides) now live in this file.
#
# Related files:
#   - package.json              — packageManager field, root scripts
#   - turbo.jsonc               — task graph that iterates these workspaces
#   - .github/workflows/ci.yml  — runs \`pnpm install --frozen-lockfile\`
#   - .gitignore                — excludes node_modules, .pnpm-store
# ============================================================================
# --- pnpm 11 run/exec behavior (root-cause fix: networked auto-install treadmill) ---
# verifyDepsBeforeRun defaults to install in pnpm 11: it re-verifies deps and
# auto-runs a NETWORKED pnpm install before every pnpm run / pnpm exec (even with a
# full node_modules), which dirties pnpm-lock.yaml and blocks git merge --ff-only in
# the sync:worktrees task. Value warn keeps the staleness signal without auto-install.
# enableGlobalVirtualStore is pinned so pnpm install records the key in the workspace
# state file, eliminating the pnpm issue 12337 spurious setting-changed full reinstall
# on every CI / non-CI switch. NOTE: pnpm 11 reads these two keys ONLY from
# pnpm-workspace.yaml; the same keys placed in .npmrc are ignored.
verifyDepsBeforeRun: warn
enableGlobalVirtualStore: false

packages:
  - "apps/*"
  - "workers/*"
  - "packages/*"
  # The top-level Playwright acceptance suite is a first-class workspace member
  # (@fleet/e2e) so its specs IMPORT shared contracts (e.g. the export-header SSOT)
  # via the workspace: protocol instead of re-declaring them and drifting.
  - "e2e"
# Single source of truth for the Zod version across every workspace package.
# All @fleet/* packages reference this via the catalog: protocol in their
# package.json (dependencies AND devDependencies), so the entire monorepo
# resolves ONE Zod, and a version bump is a one-line change here. Pinned to the
# latest stable Zod 4 (4.x is now published at the package root and is the 2026
# ecosystem standard). Exact (not ^) so the resolved version is deterministic.
catalog:
  zod: 4.4.3
# Dependencies permitted to run install/build lifecycle scripts. pnpm 11
# blocks all build scripts by default; these are the packages that
# legitimately need to compile native addons or download prebuilt binaries.
allowBuilds:
  "@nestjs/core": true
  "@sentry/cli": true
  cpu-features: true
  dtrace-provider: false
  esbuild: true
  msgpackr-extract: true
  protobufjs: true
  sharp: true
  ssh2: true
# Transitive-dependency version pins (security floors + tooling alignment).
overrides:
  "vite@<8.0.16": ">=8.0.16"
  esbuild: ">=0.28.1"
  # GHSA-r28c-9q8g-f849: postcss <=8.5.17 path traversal in previous-source-map
  # auto-loading (sourceMappingURL) leaks arbitrary .map files. The tree carried
  # TWO resolutions -- 8.5.21 (already patched) and a stale 8.5.15 pinned through
  # the webpack/@sentry/nextjs peer chain that the old >=8.5.10 floor still
  # satisfied, so it never re-resolved. Raising the floor forces it forward; no
  # release-age exclude is needed because 8.5.21 already installs cleanly.
  postcss: ">=8.5.18"
  uuid: ">=14.0.0"
  vitest: "4.1.5"
  "@vitest/coverage-v8": "4.1.5"
  "@vitest/coverage-istanbul": "4.1.5"
  fast-xml-builder: ">=1.1.7"
  # GHSA-6gpp-xcg3-4w24 / m99w-x7hq-7vfj / 89xv-2m56-2m9x / p9j2-gv94-2wf4:
  # next <16.2.11 middleware/proxy bypass + Server Action DoS + 2x SSRF.
  next: ">=16.2.11"
  "@opentelemetry/auto-instrumentations-node": ">=0.75.0"
  "@opentelemetry/sdk-node": ">=0.217.0"
  # GHSA-45rx-2jwx-cxfr (CVE-2026-59892): propagator-jaeger <2.9.0 uncaught URIError DoS on malformed uber-trace-id header. sdk-node 0.217.0 pins it to EXACT 2.7.1, so re-resolve cannot reach the patch -- scoped override is the last-resort fix.
  "@opentelemetry/propagator-jaeger": ">=2.9.0"
  "protobufjs@<7.5.6": ">=7.5.6"
  "protobufjs@>=8.0.0 <=8.0.1": ">=8.0.2"
  glob: ">=10.0.0"
  rimraf: ">=4.0.0"
  "@ungap/structured-clone": ">=1.3.0"
  tmp: ">=0.2.6"
  # GHSA-mh99-v99m-4gvg (CVE-2026-14257): brace-expansion <=5.0.7 memory
  # exhaustion. expand() caps the NUMBER of results (max, default 100000) but
  # not the LENGTH of each result string, so chained brace groups keep the
  # count under the cap while every result grows until the process dies.
  # Dev-only, transitive via eslint and stryker-mutator through minimatch.
  # Bare floor, previously raised to >=5.0.8 for GHSA-mh99-v99m-4gvg, is again
  # one patch below the fix: GHSA-rgw5-rvv9-x895 reports a DoS via unbounded
  # intermediate arrays that BYPASSES the CVE-2026-14257 mitigation, so <5.0.9
  # is vulnerable despite the earlier patch. Same stale-floor shape, third time.
  brace-expansion: ">=5.0.9"
  ws: ">=8.20.1"
  protobufjs: ">=8.2.0"
  "@expo/dom-webview": "55.0.6"
  qs: ">=6.15.2"
  shell-quote: ">=1.8.5"
  '@grpc/grpc-js@>=1.14.0 <1.14.4': ^1.14.4
  '@babel/core@<=7.29.0': ^7.29.1
  '@opentelemetry/core@<2.8.0': ^2.8.0
  form-data@>=4.0.0 <4.0.6: ^4.0.6
  # GHSA-5p4m-2wfm-xmqj (CVE-2026-59870, 4.x line): !!omap resolution is
  # quadratic -- omapTag.addItem() does a linear duplicate-key scan on every
  # insertion, so a small crafted ordered-map document stalls yaml.load() for
  # seconds. Patched 4.3.1; the advisory records the 5.x fix was NOT backported,
  # which is why 4.x needed its own release. PRODUCTION-reachable: CI's
  # `pnpm audit --prod` flags it via apps/api -> drizzle-orm -> expo-sqlite ->
  # expo -> @expo/cli, so ignoreGhsas is not available -- it must actually move.
  #
  # CONVERGENCE OVERRIDE (pnpm 11.13+, the "pkg@" empty-range form), not a
  # hand-bounded selector. This is the fourth stale-floor in this file, and the
  # cause is always the same: a regular override fires only when the consumer's
  # DECLARED range is a strict SUBSET of the selector (pnpm#6878). cosmiconfig
  # declares ^4.1.0 = >=4.1.0 <5.0.0-0; a selector bounded at the advisory edge
  # (<4.3.1 = >=0.0.0 <4.3.1) is not a superset, so the entry sits in the
  # lockfile looking applied while the resolution stays vulnerable. Verified
  # here: <4.3.0 went inert the moment 4.3.0 resolved, and a <4.3.1 attempt left
  # `pnpm why` reporting 4.3.0 after both --lockfile-only and a targeted update.
  #
  # The empty-range form moves the compatibility test from author-time to
  # RESOLUTION time: pnpm rewrites an edge only when 4.3.1 satisfies that edge's
  # own range. cosmiconfig ^4.1.0 converges; @istanbuljs/load-nyc-config ^3.13.1
  # is left alone automatically -- no hand-computed major bound to get wrong, and
  # a future dependent declaring a different-but-compatible range is covered too.
  # It also self-reports: when every declared range admits something newer, pnpm
  # warns the override is stale and names the version, so the next advisory is
  # caught here rather than by a red CI gate.
  #
  # Supersedes the earlier bounded-caret entry, whose comment recorded that an
  # UNBOUNDED >=4.3.0 once dragged cosmiconfig ^4.1.0 across a major into 5.x
  # and imported GHSA-pm4m-ph32-ghv5. The convergence form cannot do that: an
  # exact 4.3.1 never satisfies a 5.x range, so 5.x edges are untouched by
  # construction rather than by a selector the author remembered to bound.
  #
  # REMOVE once cosmiconfig and jsdom floor their own js-yaml ranges at >=4.3.1.
  "js-yaml@": "4.3.1"
  protobufjs@>=8.0.0 <=8.5.0: ^8.5.1
  protobufjs@>=8.2.0 <=8.4.2: ^8.4.3
  tmp@>=0.2.6 <0.2.7: ^0.2.7
  vite: ">=8.0.16"
  multer: ">=2.2.0"
  # GHSA-2v37-7h3g-55p8: nanoid <3.3.17 loops forever when a custom generator
  # is called with size zero. Same optional-Expo-peer chain, via postcss and
  # @react-navigation. Bounded so majors 4+ are untouched.
  "nanoid@<3.3.17": ">=3.3.17"
  # GHSA-vmh5-mc38-953g: undici 7.23.0-7.27.x SOCKS5 ProxyAgent TLS bypass.
  # Transitive via @semantic-release/github + testcontainers; scoped to the
  # vulnerable 7.x range so undici 6.x (via @semantic-release/npm) is untouched.
  "undici@>=7.23.0 <7.28.0": ">=7.28.0"
  # GHSA-2m8v-j782-fhvr: socket.io-parser <4.2.7 zero-attachment memory
  # exhaustion -- a crafted packet makes the server wait on and buffer an
  # unbounded number of binary attachments. Reaches us through
  # @nestjs/platform-socket.io -> socket.io, so it is a RUNTIME path on the api
  # (the commands gateway), not dev-only. Scoped to the vulnerable range so
  # other majors are untouched.
  "socket.io-parser@>=4.0.0 <4.2.7": ">=4.2.7"
  # GHSA-vxpw-j846-p89q: undici <6.27.0 WebSocket DoS via fragment count
  # bypass. Transitive via @semantic-release/* -> @actions/http-client (the
  # 6.x path the 7.x pin above intentionally left alone). Dev-only (Release
  # CI job). Scoped to the vulnerable 6.x range so other majors are untouched.
  "undici@<6.27.0": ">=6.27.0"
  # GHSA-7p8r-x3mc-p8w7: fast-uri <3.1.5 host confusion -- a backslash is
  # accepted as an authority introducer, so a crafted URI parses to an
  # unexpected host. PRODUCTION-reachable, verified with pnpm audit --prod:
  # apps/ops-web -> @sentry/nextjs -> @sentry/webpack-plugin -> webpack ->
  # schema-utils -> ajv -> fast-uri (dev paths via commitlint/stryker too).
  # ajv declares "^3.0.1" which already admits 3.1.5, but the lockfile froze
  # 3.1.4 and pnpm 11 seeds preferredVersions from the lockfile, so it never
  # re-resolves on its own (11.10 notes, #10662) -- an in-range update was
  # tried first and reported "Already up to date". Bounded selector so no
  # future consumer is dragged across a major (the js-yaml lesson above).
  # REMOVE once ajv ships a release whose own floor is >=3.1.5.
  "fast-uri@>=3.0.0 <3.1.5": ">=3.1.5"
# Accepted-risk allowlist (pnpm 11 filters audit by GHSA, not CVE).
auditConfig:
  ignoreGhsas:
    # GHSA-f88m-g3jw-g9cj: sharp <0.35.0 inherited libvips CVEs. sharp is an
    # OPTIONAL dep of next (^0.34.5, which cannot admit 0.35.0), used ONLY by
    # Next Image Optimization. ops-web has NO next/image usage and NO images
    # config, so sharp is never invoked at runtime -- zero exposure. Forcing
    # sharp 0.35.0 (drops Node 18, native/libvips change next has not validated)
    # would risk the Image pipeline for a code path we never execute. Revisit
    # and remove when next bumps its sharp range to admit >=0.35.0. (2026-07)
    - GHSA-f88m-g3jw-g9cj
    # GHSA-w3rx-r6r6-pgpr / GHSA-5p2g-fcmc-qvqq: image-size <=2.0.2 infinite
    # loops in the ICNS, JXL and HEIF parsers.
    #
    # NO PATCH EXISTS. The advisory names >=2.0.3, but 2.0.3 is UNPUBLISHED --
    # the latest release is 2.0.2, so an override fails the install outright
    # with ERR_PNPM_NO_MATCHING_VERSION. This was attempted and reverted.
    #
    # NOT REACHABLE, verified rather than assumed (three facts): drizzle-orm
    # declares expo-sqlite with peerDependenciesMeta {"optional": true};
    # apps/api declares NO expo or react-native dependency (expo-server-sdk is
    # push notifications, a different package); and the api source never
    # imports expo-sqlite. The chain
    # api -> drizzle-orm -> expo-sqlite -> expo -> metro -> image-size
    # exists only because pnpm materialises an OPTIONAL peer in the graph.
    # metro is a bundler and is absent from the shipped api image, so the
    # vulnerable parsers are never loaded, let alone fed an image.
    #
    # CORROBORATED FROM THE SHIPPED ARTIFACT, not only from the graph: building
    # Dockerfile.api's exact tree (pnpm --filter=@fleet/api deploy --prod
    # --no-optional) yields 0 image-size directories, 0 metro, 0 Expo SDK, and
    # pnpm audit --prod run INSIDE that tree reports no known vulnerabilities.
    # Probe validated against positive controls (drizzle-orm, pg, @nestjs/core,
    # zod all present), so the zeros are absence, not a broken search.
    #
    # 2026 practice for an unpatched advisory is an explicit, documented
    # acceptance with a revisit condition -- an accepted risk differs from an
    # overlooked one. REMOVE as soon as image-size 2.0.3 publishes; recheck
    # weekly, since patches usually land within days of an advisory.
    - GHSA-w3rx-r6r6-pgpr
    - GHSA-5p2g-fcmc-qvqq
    # TWO DISTINCT ADVISORIES, listed together only because both are
    # dev-only and neither can be cleared by the override alone.
    #
    # GHSA-4cwx-7wf7-3272 -- undici <8.9.0 cache-interceptor cross-user
    # disclosure in SHARED-CACHE mode. Patched >=8.9.0.
    # GHSA-rgw5-rvv9-x895 -- brace-expansion DoS via unbounded intermediate
    # arrays, bypassing the CVE-2026-14257 mitigation. Patched >=5.0.9, and
    # the floor at the brace-expansion override above already resolves that
    # version. The ignore is still REQUIRED: removing it makes pnpm audit
    # exit 1 (verified A/B on an otherwise identical tree), so the advisory
    # is reported against the tree even with the patched version resolved.
    # An earlier revision of this comment attributed BOTH ids to undici.
    #
    # DEV-ONLY, verified by evidence not intuition: `pnpm audit --prod` reports
    # undici nowhere. Every path in `pnpm why undici` terminates in
    # devDependencies -- @semantic-release/* (release tooling, CI-only) and
    # testcontainers (a devDependency of @fleet/api). No shipped image contains
    # it, and nothing we run enables interceptors.cache() at all.
    #
    # WHY NOT AN OVERRIDE: `pnpm why` reports "Found 1 version" -- one shared
    # copy serves consumers whose declared ranges cannot all admit >=8.9.0
    # (@actions/http-client, @semantic-release/github, testcontainers). pnpm
    # keeps the version satisfying everyone and DECLINES the override without
    # erroring: the entry lands in the lockfile's overrides block and the
    # resolution stays at 8.5.0. A bounded selector was tried at <8.9.0 and at
    # <9.0.0; neither fires. The cooldown was ruled out -- 8.9.0 published
    # weeks ago, and 8.10.0 is available too.
    #
    # THE REAL FIX is upstream: @semantic-release/* and testcontainers must
    # floor their undici ranges at >=8.9.0. REMOVE this entry once they do.
    - GHSA-4cwx-7wf7-3272
    - GHSA-rgw5-rvv9-x895
    # GHSA-w3rx-r6r6-pgpr / GHSA-5p2g-fcmc-qvqq -- image-size <=2.0.2 infinite
    # loops in the ICNS, JXL and HEIF parsers. Patched 2.0.3.
    #
    # NO OVERRIDE CAN MOVE IT. metro@0.83.7 declares image-size ^1.0.2. A
    # convergence override is inert by construction (an exact 2.0.3 never satisfies
    # ^1.0.2) and a bounded floor would drag metro across a major -- the exact
    # failure the js-yaml comment above records, where an unbounded floor dragged
    # cosmiconfig into 5.x and imported a NEW advisory.
    #
    # NOT SHIPPED -- verified from the ARTIFACT, not inferred from the graph. It
    # reaches the workspace audit only via apps/api -> drizzle-orm -> expo-sqlite
    # -> expo -> metro, where expo-sqlite is a drizzle-orm OPTIONAL PEER that pnpm
    # installs regardless (pnpm#11155). Dockerfile.api builds with
    # `pnpm --filter=@fleet/api deploy --prod --no-optional`, which prunes that
    # subtree. Probe of that exact tree: 0 image-size dirs, 0 metro, 0 Expo SDK
    # (only expo-server-sdk, a genuine push dep), and `pnpm audit --prod` run
    # INSIDE it reports "No known vulnerabilities found". Probe validated against
    # positive controls -- drizzle-orm, pg, @nestjs/core, zod all found -- so the
    # zeros are absence, not a broken search. This is a VEX-style exploitability
    # statement: gate on what ships, not on the whole graph (2026 practice).
    #
    # A "-" peer-removal override on drizzle-orm>expo-sqlite was tried first and
    # did NOT fire: pnpm why was byte-identical after re-resolution. driver-app
    # imports drizzle-orm/expo-sqlite directly, so that edge is load-bearing there.
    #
    # ROOT FIX, tracked separately: scope the BLOCKING audit in ci.yml to the
    # deploy artifact rather than the workspace graph. Seven of the last ten
    # commits to this file are floor raises for advisories that never ship. Not
    # done here because it needs a job reorder (the audit runs before Build) --
    # a security-control change must be attributable, not buried in a feature PR.
    #
    # REMOVE once metro floors its own image-size range at >=2.0.3.
minimumReleaseAgeExclude:
  - tmp@0.2.6 || 0.2.7
  - '@grpc/grpc-js@1.14.4'
  - protobufjs@8.4.3 || 8.5.1 || 8.6.5 || 8.6.6
  - form-data@4.0.6
  - vite@8.0.16
  - js-yaml@4.3.0 || 4.3.1
  - '@babel/core@7.29.1'
  - '@opentelemetry/core@2.8.0'
  - multer@2.2.0
  - undici@6.27.0 || 7.28.0 || 8.9.0 || 8.10.0
  - brace-expansion@5.0.9
  - fast-uri@3.1.3 || 3.1.4 || 3.1.5 || 4.0.1 || 4.1.1
  - socket.io-parser@4.2.7
  - '@turbo/darwin-64@2.10.2 || 2.10.3 || 2.10.8 || 2.10.9'
  - '@turbo/darwin-arm64@2.10.2 || 2.10.3 || 2.10.8 || 2.10.9'
  - '@turbo/linux-64@2.10.2 || 2.10.3 || 2.10.8 || 2.10.9'
  - '@turbo/linux-arm64@2.10.2 || 2.10.3 || 2.10.8 || 2.10.9'
  - '@turbo/windows-64@2.10.2 || 2.10.3 || 2.10.8 || 2.10.9'
  - '@turbo/windows-arm64@2.10.2 || 2.10.3 || 2.10.8 || 2.10.9'
  - turbo@2.10.2 || 2.10.3 || 2.10.8 || 2.10.9
  - body-parser@2.3.0
  - '@opentelemetry/propagator-jaeger@2.9.0'
  - sharp@0.35.0
  - next@16.2.11
